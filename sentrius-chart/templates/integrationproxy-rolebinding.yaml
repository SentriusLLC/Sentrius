apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-integrationproxy-binding
  namespace: {{ .Values.tenant }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-integrationproxy
roleRef:
  kind: Role
  name: {{ .Release.Name }}-integrationproxy-role
  apiGroup: rbac.authorization.k8s.io
