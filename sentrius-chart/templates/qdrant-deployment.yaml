{{- if .Values.qdrant.enabled }}
# qdrant-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
          imagePullPolicy: "{{ .Values.qdrant.image.pullPolicy }}"
          ports:
            - containerPort: {{ .Values.qdrant.port }}
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage

      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-pvc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qdrant-from-integration-proxy
spec:
  podSelector:
    matchLabels:
      app: qdrant
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: integration-proxy
      ports:
        - protocol: TCP
          port: {{ .Values.qdrant.port }}
  policyTypes:
    - Ingress
{{- end }}