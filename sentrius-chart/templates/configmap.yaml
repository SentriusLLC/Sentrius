  default-policy.yaml: |
    ---
    version: "v0"
    description: "Default Policy For Unregistered Agents ( if configured )"
    match:
      agent_tags:
        - "env:prod"
        - "classification:observer"
    behavior:
      minimum_positive_runs: 5
      max_incidents: 1
      incident_types:
        denylist:
          - "policy_violation"
    actions:
      on_success: "allow"
      on_failure: "deny"
      on_marginal:
        action: "require_ztat"
        ztat_provider: "ztat-service.internal"
    capabilities:
      primitives:
        - id: "accessLLM"
          description: "access llm"
          endpoints:
            - "/api/v1/chat/completions"
        - id: "endpoints"
          description: "endpoints "
          endpoints:
            - "/api/v1/capabilities/endpoints"
        - id: "registration"
          description: "registration "
          endpoints:
            - "/api/v1/agent/bootstrap/register"
        - id: "verbs"
          description: "verb endpoint "
          endpoints:
            - "/api/v1/capabilities/verbs"
        - id: "createAgent"
          description: "Create agent  "
          endpoints:
            - "/api/v1/agent/context"
            - "/api/v1/agent/bootstrap/launcher/create"
            - "/api/v1/agent/bootstrap/launcher/status"
            - "/api/v1/capabilities/endpoints"
      composed:
    ztat:
      provider: "ztat-service.internal"
      ttl: "5m"
      approved_issuers:
        - "http://localhost:8080/"
      key_binding: "RSA2048"
      approval_required: true
    policy_id: "f3326ce2-f46f-405d-94b6-bda2b26db423"
    identity:
      issuer: "https://keycloak.test.sentrius.cloud"
      subject_prefix: "agent-"
      mfa_required: true
      certificate_authority: "Sentrius-CA"
    provenance:
      source: "https://test.sentrius.cloud"
      signature_required: true
      approved_committers:
        - "alice@example.com"
    runtime:
      enclave_required: true
      attestation_type: "aws-nitro"
      verified_at_boot: true
      allow_drift: true
    trust_score:
      minimum: 80
      marginalThreshold: 50
      weightings:
        identity: 0.5
        provenance: 0.2
        runtime: 0.3
        behavior: 0.2

  dynamic.properties: |
    auditorClass=io.sentrius.sso.automation.auditing.AccessTokenAuditor
    twopartyapproval.option.LOCKING_SYSTEMS=true
    requireProfileForLogin=true
    maxJitDurationMs=1440000
    sshEnabled=true
    systemLogoName={{ .Values.tenant }}
    AccessTokenAuditor.rule.4=io.sentrius.sso.automation.auditing.rules.OpenAISessionRule;Malicious AI Monitoring
    AccessTokenAuditor.rule.5=io.sentrius.sso.automation.auditing.rules.TwoPartyAIMonitor;AI Second Party Monitor
    AccessTokenAuditor.rule.6=io.sentrius.sso.automation.auditing.rules.SudoApproval;Sudo Approval
    allowProxies=true
    AccessTokenAuditor.rule.2=io.sentrius.sso.automation.auditing.rules.DeletePrevention;Delete Prevention
    AccessTokenAuditor.rule.3=io.sentrius.sso.automation.auditing.rules.TwoPartySessionRule;Require Second Party Monitoring
    AccessTokenAuditor.rule.0=io.sentrius.sso.automation.auditing.rules.CommandEvaluator;Restricted Commands
    terminalsInNewTab=false
    auditFlushIntervalMs=5000
    AccessTokenAuditor.rule.1=io.sentrius.sso.automation.auditing.rules.AllowedCommandsRule;Approved Commands
    knownHostsPath=/home/marc/.ssh/known_hosts
    systemLogoPathLarge=/images/sentrius_large.jpg
    maxJitUses=1
    systemLogoPathSmall=/images/sentrius_small.png
    enableInternalAudit=true
