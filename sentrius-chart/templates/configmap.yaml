    spring.security.oauth2.client.registration.keycloak.client-id={{ .Values.rdpproxy.oauth2.client_id }}
    spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
    spring.security.oauth2.client.registration.keycloak.authorization-grant-type={{ .Values.rdpproxy.oauth2.authorization_grant_type }}
    #spring.security.oauth2.client.registration.keycloak.redirect-uri={{ .Values.sentriusDomain }}/login/oauth2/code/keycloak
    #spring.security.oauth2.client.registration.keycloak.scope={{ .Values.sentriusagent.oauth2.scope }}
    spring.security.oauth2.resourceserver.jwt.issuer-uri={{ .Values.keycloakInternalDomain | default .Values.keycloakDomain }}/realms/sentrius
    spring.security.oauth2.client.provider.keycloak.issuer-uri={{ .Values.keycloakInternalDomain | default .Values.keycloakDomain }}/realms/sentrius
    # OTEL settings
    otel.traces.exporter=otlp
    otel.metrics.exporter=none
    otel.logs.exporter=none
    otel.exporter.otlp.endpoint=http://sentrius-jaeger:4317
    otel.resource.attributes.service.name=rdp-proxy
    otel.traces.sampler=always_on
    otel.exporter.otlp.timeout=10s
    otel.exporter.otlp.protocol=grpc
    provenance.kafka.topic=sentrius-provenance
    # Serialization
    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
    spring.kafka.producer.properties.spring.json.trusted.packages=io.sentrius.*
    # Reliability
    spring.kafka.producer.retries=5
    spring.kafka.producer.acks=all
    # Timeout tuning
    spring.kafka.producer.request-timeout-ms=10000
    spring.kafka.producer.delivery-timeout-ms=30000
    spring.kafka.properties.max.block.ms=500
    spring.kafka.properties.metadata.max.age.ms=10000
    spring.kafka.properties.retry.backoff.ms=1000
    spring.kafka.bootstrap-servers=sentrius-kafka:9092
    # RDP Proxy settings
    sentrius.rdp-proxy.enabled=true
    sentrius.rdp-proxy.port=3389
    sentrius.rdp-proxy.max-concurrent-sessions=100
    sentrius.rdp-proxy.security.require-server-authentication=true
    management.endpoints.web.exposure.include=health
    management.endpoint.health.show-details=always
    spring.datasource.url=jdbc:postgresql://sentrius-postgres:5432/sentrius
    spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
    spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
    sentrius.rdp-proxy.security.jwt.algorithm=RS256
    sentrius.rdp-proxy.security.jwt.keySize=2048
    sentrius.rdp-proxy.security.jwt.keyRotationDays=30
    sentrius.rdp-proxy.security.jwt.issuer=sentrius-api
    sentrius.rdp-proxy.security.jwt.audience=rdp-proxy
    sentrius.rdp-proxy.security.jwt.tokenTtlMinutes=30
    # RSA Key Management Configuration
    sentrius.rdp-proxy.security.rsa.keyStorePath=${user.home}/.sentrius/keys/
    sentrius.rdp-proxy.security.rsa.publicKeyEndpoint=/api/v1/rdp-proxy/public-key
    sentrius.rdp-proxy.security.rsa.keyRotationEnabled=true
    sentrius.rdp-proxy.security.rsa.multipleKeySupport=true
    # WebSocket Security Configuration
    sentrius.rdp-proxy.security.websocket.allowedOrigins=*
    sentrius.rdp-proxy.security.websocket.maxSessions=100
    sentrius.rdp-proxy.security.websocket.connectionTimeout=30000
    sentrius.rdp-proxy.security.websocket.requireAuthentication=true