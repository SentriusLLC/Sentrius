apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-oauth2-secrets
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # Sentrius OAuth2 Client Secret
  {{- if .Values.sentrius.oauth2.client_secret }}
  sentrius-client-secret: {{ .Values.keycloak.realm.clients.sentriusApi.client_secret | b64enc }}
  {{- else }}
  sentrius-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  # Integration Proxy OAuth2 Client Secret
  {{- if .Values.keycloak.realm.clients.sentriusApi.client_secret }}
  integrationproxy-client-secret: {{ .Values.keycloak.realm.clients.sentriusApi.client_secret | b64enc }}
  {{- else }}
  integrationproxy-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  # Sentrius Agent OAuth2 Client Secret
  {{- if .Values.keycloak.realm.clients.javaAgents.client_secret }}
  sentriusagent-client-secret: {{ .Values.keycloak.realm.clients.javaAgents.client_secret | b64enc }}
  {{- else }}
  sentriusagent-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  # Sentrius AI Agent OAuth2 Client Secret
  {{- if .Values.keycloak.realm.clients.aiAgentAssessor.client_secret }}
  sentriusaiagent-client-secret: {{ .Values.keycloak.realm.clients.aiAgentAssessor.client_secret | b64enc }}
  {{- else }}
  sentriusaiagent-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  # Launcher Service OAuth2 Client Secret
  {{- if .Values.keycloak.realm.clients.sentriusLauncher.client_secret }}
  launcherservice-client-secret: {{ .Values.keycloak.realm.clients.sentriusLauncher.client_secret | b64enc }}
  {{- else }}
  launcherservice-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  # Keycloak Realm Client Secrets - These are used by Keycloak realm configuration
  {{- if .Values.keycloak.realm.clients.sentriusApi.client_secret }}
  sentrius-api-client-secret: {{ .Values.keycloak.realm.clients.sentriusApi.client_secret | b64enc }}
  {{- else }}
  sentrius-api-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  {{- if .Values.keycloak.realm.clients.sentriusLauncher.client_secret }}
  sentrius-launcher-service-client-secret: {{ .Values.keycloak.realm.clients.sentriusLauncher.client_secret | b64enc }}
  {{- else }}
  sentrius-launcher-service-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  {{- if .Values.keycloak.realm.clients.sshProxy.client_secret }}
  ssh-proxy-client-secret: {{ .Values.keycloak.realm.clients.sshProxy.client_secret | b64enc }}
  {{- else }}
  ssh-proxy-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  {{- if .Values.keycloak.realm.clients.javaAgents.client_secret }}
  java-agents-client-secret: {{ .Values.keycloak.realm.clients.javaAgents.client_secret | b64enc }}
  {{- else }}
  java-agents-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  {{- if .Values.keycloak.realm.clients.aiAgentAssessor.client_secret }}
  monitoring-agent-client-secret: {{ .Values.keycloak.realm.clients.aiAgentAssessor.client_secret | b64enc }}
  {{- else }}
  monitoring-agent-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  # Agent Proxy OAuth2 Client Secret
  {{- if .Values.keycloak.realm.clients.agentProxy.client_secret }}
  agentproxy-client-secret: {{ .Values.keycloak.realm.clients.javaAgents.client_secret | b64enc }}
  {{- else }}
  agentproxy-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}


  # RDP Proxy OAuth2 Client Secret
  {{- if .Values.keycloak.realm.clients.agentProxy.client_secret }}
  rdpproxy-client-secret: {{ .Values.keycloak.realm.clients.javaAgents.client_secret | b64enc }}
  {{- else }}
  rdpproxy-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  # Prompt Advisor OAuth2 Client Secret
  {{- if .Values.promptAdvisor.clientSecret }}
  prompt-advisor-client-secret: {{ .Values.promptAdvisor.clientSecret | b64enc }}
  {{- else }}
  prompt-advisor-client-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
