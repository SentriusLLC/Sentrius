{{- if eq .Values.environment "gke" }}
# sentrius-backend-config.yaml
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: agentproxy-backend-config
  namespace: {{ .Values.tenant }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  # ADD THIS - WebSocket timeout (1 hour)
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  # Health check is required for GKE Ingress to work
  healthCheck:
    type: HTTP
    port: {{ .Values.agentproxy.port }}
    requestPath: /actuator/health
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
{{- end }}