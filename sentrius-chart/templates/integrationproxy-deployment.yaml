apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-integrationproxy
  labels:
    {{- include "sentrius.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: integrationproxy
  template:
    metadata:
      labels:
        app: integrationproxy
    spec:
      serviceAccountName: {{ .Release.Name }}-integrationproxy
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: [ 'sh', '-c', 'until nc -z {{ .Release.Name }}-sentrius 8080; do echo waiting for postgres; sleep 2;
          done;' ]
      containers:
        - name: integrationproxy
          image: "{{ .Values.integrationproxy.image.repository }}:{{ .Values.integrationproxy.image.tag }}"
          imagePullPolicy: {{ .Values.sentrius.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.sentrius.port }}
          {{- if not (eq .Values.environment "gke") }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.readinessProbe.path }}
              port: {{ .Values.healthCheck.readinessProbe.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.livenessProbe.path }}
              port: {{ .Values.healthCheck.livenessProbe.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: db-password
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: keystore-password
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-oauth2-secrets
                  key: integrationproxy-client-secret

      volumes:
        - name: config-volume
          {{- if .Values.config.usePVC }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config-pvc
          {{- else }}
          configMap:
            name: {{ .Release.Name }}-config
          {{- end }}
