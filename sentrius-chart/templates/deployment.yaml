apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sentrius
  labels:
    {{- include "sentrius.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: sentrius
  template:
    metadata:
      labels:
        app: sentrius
    spec:

      {{- if not .Values.cloudsql.enabled }}
      # Only needed when using in-cluster Postgres (Minikube, local dev)
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: [ "sh", "-c", "until nc -z {{ .Release.Name }}-postgres 5432; do echo waiting for postgres; sleep 2; done;" ]
      {{- end }}

      containers:
        - name: sentrius
          image: "{{ .Values.sentrius.image.repository }}:{{ .Values.sentrius.image.tag }}"
          imagePullPolicy: {{ .Values.sentrius.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.sentrius.port }}

          {{- if not (eq .Values.environment "gke") }}
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 60
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.readinessProbe.path }}
              port: {{ .Values.healthCheck.readinessProbe.port }}
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.livenessProbe.path }}
              port: {{ .Values.healthCheck.livenessProbe.port }}
            periodSeconds: 20
            failureThreshold: 3
          {{- end }}

          volumeMounts:
            - name: config-volume
              mountPath: /config

          env:
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-oauth2-secrets
                  key: sentrius-api-client-secret

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: db-username

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: db-password

            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: keystore-password

            {{- if .Values.surrealdb.enabled }}
            - name: SURREALDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-surrealdb-secret
                  key: password
            {{- end }}

            # Database URL switches based on Cloud SQL mode
            - name: SPRING_DATASOURCE_URL
              value: {{- if .Values.cloudsql.enabled }}
                  "jdbc:postgresql://127.0.0.1:5432/{{ .Values.database.name }}"
                {{- else }}
                    "{{ .Values.postgres.jdbcUrl }}"
                {{- end }}

      {{- if .Values.cloudsql.enabled }}
        # -------------------------------------------------------------------
        # Cloud SQL Auth Proxy Sidecar (ONLY in GKE when cloudsql.enabled=true)
        # -------------------------------------------------------------------
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.37.0
          command:
            - "/cloud_sql_proxy"
            - "-instances={{ .Values.cloudsql.instanceConnectionName }}=tcp:5432"
            - "-structured-logs"
          securityContext:
            runAsNonRoot: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      {{- end }}

      volumes:
        - name: config-volume
          {{- if .Values.config.usePVC }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config-pvc
          {{- else }}
          configMap:
            name: {{ .Release.Name }}-config
          {{- end }}
