apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prompt-advisor
  namespace: {{ .Values.namespace }}
  labels:
    app: prompt-advisor
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.promptAdvisor.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: prompt-advisor
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: prompt-advisor
        release: {{ .Release.Name }}
    spec:
      volumes:
      - name: keycloak-token
        emptyDir: {}
      containers:
      # Token refresher sidecar - obtains and refreshes Keycloak access token
      - name: token-refresher
        image: "{{ .Values.promptAdvisor.tokenRefresher.repository }}:{{ .Values.promptAdvisor.tokenRefresher.tag | default "latest" }}"
        imagePullPolicy: {{ .Values.promptAdvisor.image.pullPolicy }}
        env:
        - name: KEYCLOAK_URL
          value: "{{ .Values.keycloakInternalDomain }}"
        - name: KEYCLOAK_REALM
          value: "sentrius"
        - name: KEYCLOAK_CLIENT_ID
          value: "prompt-advisor"
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-oauth2-secrets
              key: prompt-advisor-client-secret
        - name: TOKEN_REFRESH_INTERVAL
          value: "{{ .Values.promptAdvisor.tokenRefreshInterval | default "300" }}"
        - name: TOKEN_FILE_PATH
          value: "/tmp/keycloak-token/token.txt"
        volumeMounts:
        - name: keycloak-token
          mountPath: /tmp/keycloak-token
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      # Main prompt-advisor service
      - name: prompt-advisor
        image: "{{ .Values.promptAdvisor.image.repository }}:{{ .Values.promptAdvisor.image.tag }}"
        imagePullPolicy: {{ .Values.promptAdvisor.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: ATPL_SCHEMA_URL
          value: "https://raw.githubusercontent.com/SentriusLLC/atpl/main/atpl.schema.json"
        - name: LLM_ENDPOINT
          value: "http://{{ .Release.Name }}-integrationproxy/api/v1/chat/completions"
        - name: LLM_MODEL
          value: "{{ .Values.promptAdvisor.llmModel | default "gpt-4" }}"
        - name: LLM_ENABLED
          value: "{{ .Values.promptAdvisor.llmEnabled | default "true" }}"
        - name: WEIGHT_PURPOSE
          value: "{{ .Values.promptAdvisor.weights.purpose | default "15" }}"
        - name: WEIGHT_SAFETY
          value: "{{ .Values.promptAdvisor.weights.safety | default "30" }}"
        - name: WEIGHT_COMPLIANCE
          value: "{{ .Values.promptAdvisor.weights.compliance | default "25" }}"
        - name: WEIGHT_PROVENANCE
          value: "{{ .Values.promptAdvisor.weights.provenance | default "15" }}"
        - name: WEIGHT_AUTONOMY
          value: "{{ .Values.promptAdvisor.weights.autonomy | default "15" }}"
        - name: TOKEN_FILE_PATH
          value: "/tmp/keycloak-token/token.txt"
        volumeMounts:
        - name: keycloak-token
          mountPath: /tmp/keycloak-token
          readOnly: true
        resources:
          {{- toYaml .Values.promptAdvisor.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prompt-advisor
  namespace: {{ .Values.namespace }}
  labels:
    app: prompt-advisor
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: prompt-advisor
    release: {{ .Release.Name }}
