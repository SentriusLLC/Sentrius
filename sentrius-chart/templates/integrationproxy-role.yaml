apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-integrationproxy-role
  namespace: {{ .Values.tenant }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "watch", "delete", "update"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
