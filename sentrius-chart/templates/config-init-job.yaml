{{- if .Values.config.usePVC }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-config-init
  labels:
    {{- include "sentrius.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed

spec:
  template:
    metadata:
      name: {{ .Release.Name }}-config-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: config-init
          image: busybox
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 50m
              memory: 256Mi
          command:
            - sh
            - -c
            - |
              set -e
              echo "Copying configuration files from ConfigMap to PVC..."
              if [ "$(ls -A /configmap-data)" ]; then
                cp -v /configmap-data/* /config/
                echo "Configuration files copied successfully"
              else
                echo "Warning: No files found in ConfigMap"
              fi
              ls -la /config/
          volumeMounts:
            - name: configmap-volume
              mountPath: /configmap-data
            - name: config-pvc
              mountPath: /config
      volumes:
        - name: configmap-volume
          configMap:
            name: {{ .Release.Name }}-config
        - name: config-pvc
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config-pvc
{{- end }}
