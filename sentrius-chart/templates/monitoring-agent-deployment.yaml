apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-monitoring-agent
  labels:
    {{- include "monitoring-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: monitoring-agent
  template:
    metadata:
      labels:
        app: monitoring-agent
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: [ 'sh', '-c', 'until nc -z {{ .Release.Name }}-postgres 5432; do echo waiting for postgres; sleep 2; done;' ]
      containers:
        - name: sentrius-agent
          image: "{{ .Values.monitoringagent.image.repository }}:{{ .Values.monitoringagent.image.tag }}"
          imagePullPolicy: {{ .Values.monitoringagent.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.monitoringagent.port }}
          volumeMounts:
            - name: config-volume
              mountPath: /config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: db-password
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: keystore-password
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-oauth2-secrets
                  key: monitoring-agent-client-secret
            - name: SPRING_DATASOURCE_URL
              value: {{- if .Values.cloudsql.enabled }}
                "jdbc:postgresql://127.0.0.1:5432/{{ .Values.database.name }}"
                                      {{- else }}
                "{{ .Values.postgres.jdbcUrl }}"
                                      {{- end }}
      volumes:
        - name: config-volume
          {{- if .Values.config.usePVC }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config-pvc
          {{- else }}
          configMap:
            name: {{ .Release.Name }}-config
          {{- end }}
