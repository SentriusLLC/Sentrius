{{- if .Values.surrealdb.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-surrealdb-from-api
  labels:
    app: surrealdb
    release: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app: surrealdb
      release: {{ .Release.Name }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sentrius
              release: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.surrealdb.port }}
  policyTypes:
    - Ingress
{{- end }}
