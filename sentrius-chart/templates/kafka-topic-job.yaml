apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init-{{ now | unixEpoch }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: kafka-topic-init
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:{{ .Values.kafka.image.tag | default "latest" }}
          command:
            - /bin/bash
            - -c
            - |
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server {{ .Values.kafka.serverName | default "kafka:9092" }} \
                --create \
                --if-not-exists \
                --topic sentrius-provenance \
                --partitions 1 \
                --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server {{ .Values.kafka.serverName | default "kafka:9092" }} \
                --create --if-not-exists \
                --topic ssh-agent-queries \
                --partitions 1 \
                --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server {{ .Values.kafka.serverName | default "kafka:9092" }} \
                --create --if-not-exists \
                --topic ssh-agent-responses \
                --partitions 1 \
                --replication-factor 1

