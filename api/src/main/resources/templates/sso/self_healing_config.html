<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta th:replace="fragments/header">
    <title>[[${systemOptions.systemLogoName}]] - Self-Healing Configuration</title>
    <style>
        .slider-container {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .policy-slider {
            position: relative;
            width: 300px;
            height: 40px;
            background: linear-gradient(to right, #dc3545 0%, #ffc107 50%, #28a745 100%);
            border-radius: 20px;
            cursor: pointer;
            margin: 0 20px;
        }
        .slider-handle {
            position: absolute;
            width: 100px;
            height: 36px;
            background: white;
            border: 2px solid #333;
            border-radius: 18px;
            top: 2px;
            transition: left 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }
        .slider-handle[data-policy="NEVER"] { left: 2px; }
        .slider-handle[data-policy="OFF_HOURS"] { left: 100px; }
        .slider-handle[data-policy="IMMEDIATE"] { left: 198px; }
        
        .pod-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            background: white;
        }
        .pod-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .pod-name {
            font-size: 18px;
            font-weight: bold;
        }
        .pod-type {
            color: #666;
            font-size: 14px;
        }
        .enable-toggle {
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/topbar"></div>
<div class="container">
    <h2>Self-Healing Configuration</h2>
    <p>Configure automatic patching policies for pods and services. Use the slider to set when each pod should be patched.</p>
    
    <div class="mb-4">
        <button type="button" class="btn btn-primary" onclick="showAddPodModal()">
            <i class="bi bi-plus-circle"></i> Add Pod Configuration
        </button>
    </div>

    <div id="podConfigs">
        <!-- Pod configurations will be loaded here -->
    </div>
</div>

<!-- Add/Edit Pod Modal -->
<div class="modal fade" id="podModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Pod Configuration</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="podForm">
                    <input type="hidden" id="podId" name="id">
                    <div class="mb-3">
                        <label for="podName" class="form-label">Pod Name</label>
                        <input type="text" class="form-control" id="podName" name="podName" required>
                    </div>
                    <div class="mb-3">
                        <label for="podType" class="form-label">Pod Type (Optional)</label>
                        <input type="text" class="form-control" id="podType" name="podType">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Patching Policy</label>
                        <select class="form-select" id="patchingPolicy" name="patchingPolicy">
                            <option value="NEVER">Never - Disabled</option>
                            <option value="OFF_HOURS">Off Hours - Patch during maintenance windows</option>
                            <option value="IMMEDIATE">Immediate - Patch as soon as error is detected</option>
                        </select>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="enabled" name="enabled" checked>
                        <label class="form-check-label" for="enabled">Enable self-healing for this pod</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="savePodConfig()">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
    let podConfigs = [];

    document.addEventListener('DOMContentLoaded', function() {
        loadPodConfigs();
    });

    function loadPodConfigs() {
        fetch('/api/v1/self-healing/config', {
            headers: {
                'Authorization': 'Bearer ' + getAuthToken()
            }
        })
        .then(response => response.json())
        .then(data => {
            podConfigs = data;
            renderPodConfigs();
        })
        .catch(error => {
            console.error('Error loading pod configs:', error);
        });
    }

    function renderPodConfigs() {
        const container = document.getElementById('podConfigs');
        if (podConfigs.length === 0) {
            container.innerHTML = '<p class="text-muted">No pod configurations yet. Click "Add Pod Configuration" to create one.</p>';
            return;
        }

        container.innerHTML = podConfigs.map(config => `
            <div class="pod-card">
                <div class="pod-header">
                    <div>
                        <div class="pod-name">${config.podName}</div>
                        ${config.podType ? `<div class="pod-type">${config.podType}</div>` : ''}
                    </div>
                    <div>
                        <button class="btn btn-sm btn-outline-primary" onclick="editPodConfig(${config.id})">
                            <i class="bi bi-pencil"></i> Edit
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletePodConfig(${config.id})">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </div>
                </div>
                <div class="slider-container">
                    <span style="width: 100px;">Never</span>
                    <div class="policy-slider" onclick="cyclePatchingPolicy(${config.id})">
                        <div class="slider-handle" data-policy="${config.patchingPolicy}">
                            ${config.patchingPolicy.replace('_', ' ')}
                        </div>
                    </div>
                    <span style="width: 100px;">Immediate</span>
                    <div class="form-check form-switch enable-toggle">
                        <input class="form-check-input" type="checkbox" ${config.enabled ? 'checked' : ''} 
                               onchange="toggleEnabled(${config.id}, this.checked)">
                        <label class="form-check-label">Enabled</label>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function showAddPodModal() {
        document.getElementById('podForm').reset();
        document.getElementById('podId').value = '';
        new bootstrap.Modal(document.getElementById('podModal')).show();
    }

    function editPodConfig(id) {
        const config = podConfigs.find(c => c.id === id);
        if (!config) return;

        document.getElementById('podId').value = config.id;
        document.getElementById('podName').value = config.podName;
        document.getElementById('podType').value = config.podType || '';
        document.getElementById('patchingPolicy').value = config.patchingPolicy;
        document.getElementById('enabled').checked = config.enabled;

        new bootstrap.Modal(document.getElementById('podModal')).show();
    }

    function savePodConfig() {
        const formData = new FormData(document.getElementById('podForm'));
        const config = {
            id: formData.get('id') || null,
            podName: formData.get('podName'),
            podType: formData.get('podType'),
            patchingPolicy: formData.get('patchingPolicy'),
            enabled: document.getElementById('enabled').checked
        };

        fetch('/api/v1/self-healing/config', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getAuthToken()
            },
            body: JSON.stringify(config)
        })
        .then(response => response.json())
        .then(data => {
            bootstrap.Modal.getInstance(document.getElementById('podModal')).hide();
            loadPodConfigs();
        })
        .catch(error => {
            console.error('Error saving pod config:', error);
            alert('Error saving configuration');
        });
    }

    function deletePodConfig(id) {
        if (!confirm('Are you sure you want to delete this configuration?')) return;

        fetch(`/api/v1/self-healing/config/${id}`, {
            method: 'DELETE',
            headers: {
                'Authorization': 'Bearer ' + getAuthToken()
            }
        })
        .then(() => {
            loadPodConfigs();
        })
        .catch(error => {
            console.error('Error deleting pod config:', error);
            alert('Error deleting configuration');
        });
    }

    function cyclePatchingPolicy(id) {
        const config = podConfigs.find(c => c.id === id);
        if (!config) return;

        const policies = ['NEVER', 'OFF_HOURS', 'IMMEDIATE'];
        const currentIndex = policies.indexOf(config.patchingPolicy);
        const nextIndex = (currentIndex + 1) % policies.length;
        config.patchingPolicy = policies[nextIndex];

        savePatchingPolicy(config);
    }

    function toggleEnabled(id, enabled) {
        const config = podConfigs.find(c => c.id === id);
        if (!config) return;

        config.enabled = enabled;
        savePatchingPolicy(config);
    }

    function savePatchingPolicy(config) {
        fetch('/api/v1/self-healing/config', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getAuthToken()
            },
            body: JSON.stringify(config)
        })
        .then(() => {
            loadPodConfigs();
        })
        .catch(error => {
            console.error('Error updating policy:', error);
        });
    }

    function getAuthToken() {
        // This should retrieve the actual auth token from your session/storage
        return sessionStorage.getItem('authToken') || '';
    }
</script>
</body>
</html>
