<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta th:replace="~{fragments/header}">
    <title>[[${systemOptions.systemLogoName}]] - System Settings</title>
    <style>

        .form-container {
            max-width: 1200px;
            margin: 80px auto;
            background: #1e1e1e; /* Slightly lighter dark for contrast */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        .form-title {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.5rem;
            color: #f8f9fa;
        }
        
        .nav-tabs {
            border-bottom: 2px solid #2b2b2b;
            gap: 5px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        .nav-tabs .nav-link {
            color: #adb5bd;
            background-color: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 12px 24px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-tabs .nav-link:hover {
            color: #f8f9fa;
            background-color: #2b2b2b;
            border-radius: 5px 5px 0 0;
        }

        .nav-tabs .nav-link.active {
            color: #007bff;
            background-color: transparent;
            border-bottom: 3px solid #007bff;
        }

        .tab-content-section {
            display: none;
        }

        .tab-content-section.active {
            display: block;
        }
        
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: #eaeaea;
        }
        th, td {
            padding: 10px;
            vertical-align: middle;
        }
        th {
            text-align: left;
            font-weight: bold;
            background-color: #2b2b2b; /* Darker for table header */
            color: #f8f9fa;
        }
        td {
            border-bottom: 1px solid #3c3c3c;
        }
        input.form-control, select.form-control {
            background-color: #2b2b2b; /* Dark input background */
            border: 1px solid #444;
            color: #eaeaea; /* Light text color */
        }
        input.form-control:focus, select.form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25); /* Bootstrap focus shadow */
        }
        .submit-btn {
            width: 100%;
            padding: 10px 15px;
            background-color: #007bff; /* Primary button color */
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
        .info-icon {
            color: #007bff;
            cursor: pointer;
        }
    </style>
</head>

<body >
<div th:replace="fragments/upload_config"></div>
<div class="container-fluid">
    <div class="row flex-nowrap">
        <div th:replace="~{fragments/sidebar}" class="col-auto sidebar" style="width: 180px;"></div>
        <div class="col py-4">
            <div class="main-content">
                <div class="navbar navbar-dark fixed-top navbar-expand-md" role="navigation" xmlns:th="http://www.thymeleaf.org">
                    <div class="container bg-dark px-3 py-2" >
                        <!-- Brand Logo -->
                        <a class="navbar-brand" href="#" style="padding-left: 45px;">
                            <a href="/sso/v1/dashboard" class="nav-link">
                                <img th:src="${systemOptions.systemLogoPathSmall}" alt="Logo" class="nav-img">
                            </a>
                        </a>

                        <!-- Toggler for Mobile -->
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <!-- Navbar Links -->
                        <div class="collapse navbar-collapse" id="navbarCollapse">
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                                <li class="nav-item">
                                    <span id="alertWarn" class="badge text-bg-warning ms-2"></span>
                                </li>
                                <li class="nav-item">
                                    <a href="#" class="nav-link" data-bs-toggle="modal"
                                       data-bs-target="#uploadConfigFormModal"
                                       th:if="${#sets.contains(operatingUser.authorizationType.accessSet, 'CAN_MANAGE_APPLICATION')}">
                                        <span id="Add Hosts" class="badge text-bg-dark">Upload Configuration</span>
                                    </a>
                                </li>

                            </ul>
                        </div>
                    </div>
                </div>
                <div th:replace="~{fragments/alerts}"></div>
<div class="form-container">
    <form th:action="@{/api/v1/system/settings}" method="post" autocomplete="off" id="settingsForm">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

        <div class="form-title">System Settings</div>

        <!-- Tabs Navigation -->
        <ul class="nav nav-tabs" role="tablist" id="settingsTabs">
            <!-- Tabs will be dynamically generated by JavaScript -->
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="tabContent">
            <!-- Tab content sections will be dynamically generated by JavaScript -->
        </div>

        <div class="form-footer mt-4">
            <button type="submit" class="submit-btn">Save All Settings</button>
        </div>
    </form>
</div>
            </div>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/upload_config.js}" defer></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    // Get all system settings from the server - systemSettings is always populated by the controller
    const allSettings = /*[[${systemSettings}]]*/ [];
    
    document.addEventListener('DOMContentLoaded', function() {
        // Validate we have settings
        if (!allSettings || allSettings.length === 0) {
            console.error('No system settings available');
            return;
        }
        
        // Group settings by their group property
        const groupedSettings = {};
        allSettings.forEach(setting => {
            // The server always ensures a group is set via the default in @Updatable annotation
            const group = setting.group;
            if (!groupedSettings[group]) {
                groupedSettings[group] = [];
            }
            groupedSettings[group].push(setting);
        });
        
        // Get unique groups and sort them (General first, then alphabetically)
        const groups = Object.keys(groupedSettings).sort((a, b) => {
            if (a === 'General') return -1;
            if (b === 'General') return 1;
            return a.localeCompare(b);
        });
        
        // Generate tabs
        const tabsContainer = document.getElementById('settingsTabs');
        groups.forEach((group, index) => {
            const li = document.createElement('li');
            li.className = 'nav-item';
            
            const a = document.createElement('a');
            a.className = 'nav-link' + (index === 0 ? ' active' : '');
            a.setAttribute('data-tab', group);
            a.setAttribute('role', 'tab');
            a.textContent = group;
            
            li.appendChild(a);
            tabsContainer.appendChild(li);
        });
        
        // Generate tab content
        const tabContentContainer = document.getElementById('tabContent');
        groups.forEach((group, index) => {
            const section = document.createElement('div');
            section.className = 'tab-content-section' + (index === 0 ? ' active' : '');
            section.id = group;
            section.setAttribute('role', 'tabpanel');
            
            const tableContainer = document.createElement('div');
            tableContainer.className = 'table-container';
            
            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const theadRow = document.createElement('tr');
            
            const th1 = document.createElement('th');
            th1.textContent = 'Setting Name';
            const th2 = document.createElement('th');
            th2.textContent = 'Value';
            
            theadRow.appendChild(th1);
            theadRow.appendChild(th2);
            thead.appendChild(theadRow);
            table.appendChild(thead);
            
            const tbody = document.createElement('tbody');
            groupedSettings[group].forEach(setting => {
                const tr = document.createElement('tr');
                
                // Setting name cell
                const tdName = document.createElement('td');
                const nameSpan = document.createElement('span');
                nameSpan.style.display = 'flex';
                nameSpan.style.alignItems = 'center';
                nameSpan.style.gap = '5px';
                
                const nameDiv = document.createElement('div');
                nameDiv.textContent = setting.name;
                nameSpan.appendChild(nameDiv);
                
                if (setting.description) {
                    const icon = document.createElement('i');
                    icon.className = 'fa-regular fa-circle-question info-icon';
                    icon.title = setting.description;
                    nameSpan.appendChild(icon);
                }
                
                tdName.appendChild(nameSpan);
                tr.appendChild(tdName);
                
                // Value cell
                const tdValue = document.createElement('td');
                const valueDiv = document.createElement('div');
                
                if (setting.closestType === 'java.lang.Boolean') {
                    const select = document.createElement('select');
                    select.name = setting.name;
                    select.className = 'form-control';
                    
                    const optionTrue = document.createElement('option');
                    optionTrue.value = 'true';
                    optionTrue.textContent = 'True';
                    if (setting.value === 'true') {
                        optionTrue.selected = true;
                    }
                    
                    const optionFalse = document.createElement('option');
                    optionFalse.value = 'false';
                    optionFalse.textContent = 'False';
                    if (setting.value === 'false') {
                        optionFalse.selected = true;
                    }
                    
                    select.appendChild(optionTrue);
                    select.appendChild(optionFalse);
                    valueDiv.appendChild(select);
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.name = setting.name;
                    input.value = setting.value || '';
                    input.className = 'form-control';
                    valueDiv.appendChild(input);
                }
                
                tdValue.appendChild(valueDiv);
                tr.appendChild(tdValue);
                
                tbody.appendChild(tr);
            });
            
            table.appendChild(tbody);
            tableContainer.appendChild(table);
            section.appendChild(tableContainer);
            tabContentContainer.appendChild(section);
        });
        
        // Setup tab switching
        document.querySelectorAll('.nav-link[data-tab]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const tabId = this.getAttribute('data-tab');
                switchTab(tabId);
            });
        });
    });
    
    function switchTab(tabId) {
        // Hide all sections
        document.querySelectorAll('.tab-content-section').forEach(section => {
            section.classList.remove('active');
        });
        
        // Remove active from all links
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.remove('active');
        });
        
        // Show selected section
        document.getElementById(tabId).classList.add('active');
        document.querySelector('.nav-link[data-tab="' + tabId + '"]').classList.add('active');
    }
    /*]]>*/
</script>
</body>
</html>
