<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark" data-bs-theme="dark">
<head>
    <meta th:replace="~{fragments/header}">
    <title>[[${systemOptions.systemLogoName}]] - Audit Sessions</title>
    <style>
        .grid-stack-item-content {
            background-color: #405d80;
            color: #fff;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .grid-stack-item-content:hover {
            transform: scale(1.05);
        }
        
        .session-tabs {
            margin-bottom: 20px;
        }
        
        .nav-tabs .nav-link {
            color: #fff;
        }
        
        .nav-tabs .nav-link.active {
            background-color: #405d80;
            color: #fff;
        }
    </style>
</head>
<!-- Thymeleaf block for variable -->
<script th:inline="javascript">
    var cmu = /*[[${#sets.contains(operatingUser.authorizationType.accessSet, 'CAN_MANAGE_USERS')}]]*/ false;
</script>

<script th:inline="none">
    $(document).ready(function() {
        
        // Initialize SSH/Terminal Sessions Table
        $('#audit-table').DataTable({
            ajax: {
                url: '/api/v1/sessions/audit/list',
                dataSrc: '',
            },
            columns: [
                { data: 'user' },
                { data: 'host' },
                { data: 'sessionTime' },
                {
                    data: 'closed',
                    render: function(data, type, row) {
                        if (data == true){
                            return `<span class="badge bg-success">Closed</span>`;
                        } else {
                            return `<span class="badge bg-danger">Open</span>`;
                        }
                    }
                },
                {
                    data: 'sessionId',
                    render: function(data, type, row) {
                        if (data) {
                            var urlencodedId = encodeURIComponent(data);
                            return`<a href="/sso/v1/sessions/audit/attach?sessionId=${urlencodedId}"><span class="badge bg-success">Terminal Logs</span></a>`;
                        }
                        else {
                            console.log("empty on row " + row);
                        }
                    }
                },
            ]
        });
        
        // Initialize RDP Sessions Table
        $('#rdp-sessions-table').DataTable({
            ajax: {
                url: '/api/v1/sessions/rdp/list',
                dataSrc: '',
            },
            columns: [
                { data: 'sessionId' },
                { data: 'userIdentifier' },
                { data: 'targetIdentifier' },
                { 
                    data: 'sessionStart',
                    render: function(data, type, row) {
                        if (data) {
                            return new Date(data).toLocaleString();
                        }
                        return 'N/A';
                    }
                },
                { 
                    data: 'sessionEnd',
                    render: function(data, type, row) {
                        if (data) {
                            return new Date(data).toLocaleString();
                        }
                        return 'Active';
                    }
                },
                { data: 'screenshotCount' },
                {
                    data: 'summary',
                    render: function(data, type, row) {
                        if (data && data.length > 0) {
                            // Show first 150 characters of summary
                            var truncated = data.substring(0, 150);
                            if (data.length > 150) {
                                truncated += '...';
                            }
                            return `<span class="text-muted" style="font-size: 0.9em;">${truncated}</span>`;
                        }
                        return '<span class="text-muted">No analysis available</span>';
                    }
                },
                {
                    data: 'sessionId',
                    render: function(data, type, row) {
                        return `<a href="/sso/v1/sessions/rdp/view?sessionId=${encodeURIComponent(data)}" class="badge bg-primary">View Details</a>`;
                    }
                },
            ],
            order: [[3, 'desc']] // Sort by session start time, newest first
        });
    });
</script>


<body>
<div class="container-fluid">
    <div class="row flex-nowrap">
        <div th:replace="~{fragments/sidebar}" class="col-auto sidebar" style="width: 180px;"></div>
        <div class="col py-4">
            <div class="main-content">
                <div th:replace="~{fragments/alerts}"></div>

                <div class="container-fluid">
                    <div class="container">
                        <h3>Session Audit</h3>
                        
                        <!-- Session Type Tabs -->
                        <ul class="nav nav-tabs session-tabs" id="sessionTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="terminal-tab" data-bs-toggle="tab" data-bs-target="#terminal-sessions" type="button" role="tab">
                                    Terminal Sessions (SSH)
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="rdp-tab" data-bs-toggle="tab" data-bs-target="#rdp-sessions" type="button" role="tab">
                                    RDP Sessions
                                </button>
                            </li>
                        </ul>
                        
                        <!-- Tab Content -->
                        <div class="tab-content" id="sessionTabContent">
                            <!-- Terminal Sessions Tab -->
                            <div class="tab-pane fade show active" id="terminal-sessions" role="tabpanel">
                                <table id="audit-table" class="display" style="width:100%">
                                    <thead>
                                    <tr>
                                        <th>Username</th>
                                        <th>Destination Host</th>
                                        <th>Connection Time</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <!-- Data will be dynamically loaded here -->
                                    </tbody>
                                </table>
                            </div>
                            
                            <!-- RDP Sessions Tab -->
                            <div class="tab-pane fade" id="rdp-sessions" role="tabpanel">
                                <table id="rdp-sessions-table" class="display" style="width:100%">
                                    <thead>
                                    <tr>
                                        <th>Session ID</th>
                                        <th>User</th>
                                        <th>Target</th>
                                        <th>Start Time</th>
                                        <th>End Time</th>
                                        <th>Screenshots</th>
                                        <th>Summary</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <!-- Data will be dynamically loaded here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
