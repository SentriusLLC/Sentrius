<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta th:replace="~{fragments/header}" />
    <title>Agent Communications</title>

    <!-- Cytoscape.js -->
    <script th:src="@{/node/js/cytoscape.js/cytoscape.min.js}"></script>

    <style>
        body { background-color: #121212; color: #eaeaea; }
        .container { margin-top: 20px; }

        /* New wrapper for constraining the graph */
        .graph-container {
            max-width: 1000px;
            margin: 30px auto;
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        #cy {
            height: 500px;
            width: 100%;
            background-color: #1e1e1e;
            border: 1px solid #333;
        }

        table {
            margin-top: 20px;
            color: #eaeaea;
        }

        pre {
            background-color: #222;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #00ff00;
        }
    </style>

</head>

<body>

<div id="csrf-token" style="display: none;" th:text="${_csrf.token}"></div>

<div class="container-fluid">
    <div class="row flex-nowrap">
        <div th:replace="~{fragments/sidebar}" class="col-auto sidebar" style="width: 180px;"></div>

        <div class="col py-4">
            <div class="row mb-3 justify-content-center">
                <div class="col-md-3">
                    <label for="startDate" class="form-label">Start Time</label>
                    <input type="date" id="startDate" class="form-control">
                </div>
                <div class="col-md-3">
                    <label for="endDate" class="form-label">End Time</label>
                    <input type="date" id="endDate" class="form-control">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" id="filterBtn">Filter</button>
                </div>
            </div>

            <div class="graph-container">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <label for="limitSelect">Show:</label>
                        <select id="limitSelect" class="form-select form-select-sm d-inline-block" style="width: auto;">
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="-1">All</option>
                        </select>
                    </div>
                    <div>
                        <button id="prevPage" class="btn btn-sm btn-secondary">Prev</button>
                        <span id="pageIndicator">Page 1</span>
                        <button id="nextPage" class="btn btn-sm btn-secondary">Next</button>
                    </div>
                </div>
                <div th:replace="~{fragments/alerts}"></div>

                <h2 class="toast-header">Agent Communications</h2>

                <div id="cy"></div>

                <h3 class="toast-header mt-4">Communication Logs</h3>
                <table id="comm-log" class="table table-striped">
                    <thead>
                    <tr>
                        <th>Source</th>
                        <th>Target</th>
                        <th>Type</th>
                        <th>Timestamp</th>
                    </tr>
                    </thead>
                    <tbody id="comm-log-body">
                    <!-- Dynamically populated -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Viewing Communication -->
<div class="modal fade" id="commModal" tabindex="-1" aria-labelledby="commModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header">
                <h5 class="modal-title" id="commModalLabel">Communication Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="commModalBody">
                <!-- Details will be injected here -->
            </div>
        </div>
    </div>
</div>

<!-- Script to load graph and handle clicks -->
<script th:inline="javascript">
    let currentPage = 0;
    let limit = 25;
    let cy;

    function formatDateToInputValue(date) {
        return date.toISOString().split('T')[0]; // yyyy-mm-dd
    }

    function formatJson(payload) {
        try {
            const obj = JSON.parse(payload);
            return JSON.stringify(obj, null, 2); // Pretty print with 2 spaces
        } catch (e) {
            // Not valid JSON, return raw
            return payload;
        }
    }


    const agentId = /*[[${agentId}]]*/ '';

    function loadWithDate(){
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;

        const startDateTime = `${start}T00:00:00`;
        const endDateTime = `${end}T23:59:59`; // Optional: include full day

        loadData(startDateTime, endDateTime);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const now = new Date();
        const oneWeekAgo = new Date();
        oneWeekAgo.setDate(now.getDate() - 7);

        document.getElementById('startDate').value = formatDateToInputValue(oneWeekAgo);
        document.getElementById('endDate').value = formatDateToInputValue(now);

        document.getElementById('filterBtn').addEventListener('click', () => {
            loadWithDate();
        });

        // Optional: auto-load on page init
        document.getElementById('filterBtn').click();
    });

    document.getElementById('limitSelect').addEventListener('change', (e) => {
        limit = parseInt(e.target.value);
        currentPage = 0;
        loadWithDate();
    });

    document.getElementById('nextPage').addEventListener('click', () => {
        currentPage++;
        loadWithDate();
    });

    document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                loadWithDate();
            }
        }
    );


    function loadData(startTime = null, endTime = null) {
        const url = new URL(`/api/v1/agent/connections`, window.location.origin);
        url.searchParams.append("agentId", agentId);
        if (startTime) url.searchParams.append("start", startTime);
        if (endTime) url.searchParams.append("end", endTime);

        if (limit > 0) {
            url.searchParams.append("limit", limit);
            url.searchParams.append("page", currentPage);
        }
        //fetch(`/api/v1/agent/connections?agentId=${encodeURIComponent(agentId)}`)
        fetch(url)
            .then(response => response.json())
            .then(content => {
                data = content.content;
                console.log(data);
                if (cy) {
                    cy.destroy();
                }
                document.getElementById("pageIndicator").innerText = `Page ${currentPage + 1}`;
                cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: [
                        ...data.flatMap(comm => [
                            { data: { id: comm.sourceAgent }, classes: 'agent' },
                            { data: { id: comm.targetAgent }, classes: 'agent' },
                            {
                                data: {
                                    id: `${comm.sourceAgent}-${comm.targetAgent}-${comm.createdAt}`,
                                    source: comm.sourceAgent,
                                    target: comm.targetAgent,
                                    label: comm.messageType,
                                    full: comm
                                },
                                classes: 'communication'
                            }
                        ])
                    ],
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#007bff',
                                'label': 'data(id)',
                                'text-valign': 'center',
                                'color': '#fff',
                                'text-outline-width': 2,
                                'text-outline-color': '#007bff'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 2,
                                'line-color': '#ccc',
                                'target-arrow-color': '#ccc',
                                'target-arrow-shape': 'triangle',
                                'curve-style': 'bezier',
                                'label': 'data(label)',
                                'font-size': '8px',
                                'text-background-color': '#222',
                                'text-background-opacity': 1,
                                'text-background-padding': '2px',
                                'text-rotation': 'autorotate'
                            }
                        }
                    ],
                    layout: {
                        name: 'cose',
                        animate: true
                    }
                });

                // Populate Communication Table
                const tbody = document.getElementById('comm-log-body');
                tbody.innerHTML = '';
                data.forEach(comm => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${comm.sourceAgent}</td>
                        <td>${comm.targetAgent}</td>
                        <td>${comm.messageType}</td>
                        <td>${comm.createdAt}</td>
                    `;
                    tbody.appendChild(row);
                });

                // Add click event for edges
                cy.on('tap', 'edge', function(evt){
                    const edge = evt.target;
                    const fullComm = edge.data('full');
                    showCommModal(fullComm);
                });

                function showCommModal(comm) {
                    const modalBody = document.getElementById('commModalBody');
                    modalBody.innerHTML = `
                        <p><strong>Source:</strong> ${comm.sourceAgent}</p>
                        <p><strong>Target:</strong> ${comm.targetAgent}</p>
                        <p><strong>Type:</strong> ${comm.messageType}</p>
                        <p><strong>Timestamp:</strong> ${comm.createdAt}</p>
                        ${comm.payload ? `<p><strong>Payload:</strong><pre>${formatJson(comm.payload)}</pre></p>` : ''}
                    `;
                    const modal = new bootstrap.Modal(document.getElementById('commModal'));
                    modal.show();
                }
            });
    }


</script>

</body>
</html>
