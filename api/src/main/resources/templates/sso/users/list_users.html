<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark" data-bs-theme="dark">
<head>
    <meta th:replace="~{fragments/header}">
    <title>[[${systemOptions.systemLogoName}]] - List Users</title>
    <style>
        .grid-stack-item-content {
            background-color: #405d80;
            color: #fff;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .grid-stack-item-content:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<script>
    $(document).ready(function() {
        const csrfToken = $("#csrf-token").text();
        var cmu = [[${#sets.contains(operatingUser.authorizationType.accessSet, 'CAN_MANAGE_USERS')}]];
        $('#user-table').DataTable({
            ajax: {
                url: '/api/v1/users/list?type=user', // list
                dataSrc: '', // Specify the property where the data is located (e.g. use 'data' if response has a "data" field)
            },
            columns: [
                { data: 'name' },
                { data: 'username' },
                { data: 'emailAddress' },
                {
                    data: 'authorizationType',
                    render: function(data, type, row) {
                        return `<span  class=\"badge text-bg-info ms-2\">${data.userTypeName}</span>`;
                    }
                },
                {
                    data: 'userId',
                    render: function(data, type, row) {
                        var myId = encodeURIComponent(data);
                        var actions = "";
                        if (cmu){
                            actions = `<a href="/sso/v1/users/lock/${myId}" class="btn btn-primary" >Lock</a> &nbsp; | &nbsp;`;
                            actions += `<a href="/sso/v1/users/edit?userId=${myId}" class="btn btn-primary" >Edit</a> &nbsp; | &nbsp;`;
                            actions += `<a href="/api/v1/users/delete?userId=${myId}" class="btn btn-primary" >Delete</a>`;
                        }
                        return actions;
                    }
                }
            ]
        });

        $('#npe-table').DataTable({
            ajax: {
                url: '/api/v1/users/list?type=non_person_entity', // list
                dataSrc: '', // Specify the property where the data is located (e.g. use 'data' if response has a "data" field)
            },
            columns: [
                { data: 'name' },
                { data: 'username' },
                { data: 'lastSeen' },
            {
                    data: 'userId',
                    render: function(data, type, row) {
                        var myId = encodeURIComponent(data);
                        var actions = "";
                        if (cmu){
                            actions = `<button class="btn btn-secondary view-policy-btn" data-agent-id="${myId}">View
                                Policy</button> &nbsp; | &nbsp;`;
                            actions += `<button class="btn btn-primary edit-policy-btn" data-agent-id="${myId}">Edit Policy</button> &nbsp; | &nbsp;`;
                            actions += `<button class="btn btn-primary audit-agent-btn" data-agent-id="${myId}">Audit</button>`;
                        }
                        return actions;
                    }
                }
            ]
        });

        $('#user-types-table').DataTable({
            ajax: {
                url: '/api/v1/users/types/list?type=user', // list
                dataSrc: '', // Specify the property where the data is located (e.g. use 'data' if response has a "data" field)
            },
            columns: [
                { data: 'userTypeName' },
                {
                    data: 'accessSet',
                    render: function(data, type, row) {
                        if (Array.isArray(data)) {
                            return data.map(item => `<span class="badge text-bg-info ms-2">${item}</span>`).join(' ');
                        } else {
                            // Fallback for unexpected data format
                            return `<span class="badge text-bg-info ms-2">${data}</span>`;
                        }
                    }
                },
                {
                    data: 'dtoId',
                    render: function(data, type, row) {
                        var actions = "";
                        if (cmu && data){
                        var myId = encodeURIComponent(data);
                            actions = `<a href="/api/v1/users/types/delete?id=${myId}" class="btn btn-primary" >Delete</a>`;
                        }
                        return actions;
                    }
                }
            ]
        });


        // View Policy
        $(document).on('click', '.view-policy-btn', function () {
            const agentId = encodeURIComponent($(this).data('agent-id'));
            fetch(`/api/v1/agent/policy?agentId=${agentId}`)
                .then(response => response.text())
                .then(data => {
                    $('#policyContent').text(data).show();
                    $('#policyEditor, #savePolicyBtn').hide();
                    new bootstrap.Modal($('#policyModal')).show();
                }).catch(err => {
                $('#policyContent').text('Failed to load policy.').show();
                console.error(err);
            });
        });

        // Audit Agent
        $(document).on('click', '.audit-agent-btn', function () {
            const agentId = encodeURIComponent($(this).data('agent-id'));
            window.open(`/sso/v1/agent/connections?agentId=${agentId}`, '_blank');
        });

        // Edit Policy
        $(document).on('click', '.edit-policy-btn', function () {
            const agentId = encodeURIComponent($(this).data('agent-id'));
            fetch(`/api/v1/agent/policy?agentId=${agentId}`)
                .then(response => response.text())
                .then(data => {
                    $('#policyEditor').val(data).show();
                    $('#policyContent').hide();
                    $('#savePolicyBtn').show().off('click').on('click', function () {
                        const updatedPolicy = $('#policyEditor').val();
                        fetch(`/api/v1/agent/policy/update?agentId=${agentId}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'text/plain',
                                'X-CSRF-TOKEN': csrfToken
                            },
                            body: updatedPolicy
                        }).then(response => {
                            if (response.ok) {
                                alert('Policy updated successfully.');
                                bootstrap.Modal.getInstance($('#policyModal')[0]).hide();
                            } else {
                                alert('Failed to update policy.');
                            }
                        });
                    });

                    new bootstrap.Modal($('#policyModal')).show();
                }).catch(err => {
                $('#policyContent').text('Failed to load policy.').show();
                console.error(err);
            });
        });



    });
</script>


<body>
<div id="csrf-token" style="display: none;" th:text="${_csrf.token}"></div>
<div th:replace="fragments/add_user"></div>
<div th:replace="fragments/add_type"></div>
<div class="container-fluid">
    <div class="row flex-nowrap">
        <div th:replace="~{fragments/sidebar}" class="col-auto sidebar" style="width: 180px;"></div>
        <div class="col py-4">
                <div class="main-content">


                    <div class="navbar navbar-dark fixed-top navbar-expand-md" role="navigation" xmlns:th="http://www.thymeleaf.org">
                        <div class="container bg-dark px-3 py-2" >
                            <!-- Brand Logo -->
                            <a class="navbar-brand" href="#" style="padding-left: 45px;">
                                <a href="/sso/v1/dashboard" class="nav-link">
                                    <img th:src="${systemOptions.systemLogoPathSmall}" alt="Logo" class="nav-img">
                                </a>
                            </a>

                            <!-- Toggler for Mobile -->
                            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                                <span class="navbar-toggler-icon"></span>
                            </button>

                            <!-- Navbar Links -->
                            <div class="collapse navbar-collapse" id="navbarCollapse">
                                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                                    <li class="nav-item">
                                        <span id="alertWarn" class="badge text-bg-warning ms-2"></span>
                                    </li>
                                    <li class="nav-item">
                                        <a href="#" class="nav-link" data-bs-toggle="modal"
                                           data-bs-target="#userFormModal"
                                           th:if="${#sets.contains(operatingUser.authorizationType.accessSet, 'CAN_EDIT_USERS')}">
                                            <span id="Add Hosts" class="badge text-bg-dark">Add User</span>
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a href="#" class="nav-link" data-bs-toggle="modal"
                                           data-bs-target="#userTypeFormModal"
                                           th:if="${#sets.contains(operatingUser.authorizationType.accessSet, 'CAN_MANAGE_USERS')}">
                                            <span id="AddType" class="badge text-bg-dark">Add Type</span>
                                        </a>
                                    </li>

                                </ul>
                            </div>
                        </div>
                    </div>
                    <div th:replace="~{fragments/alerts}"></div>
                    <div  th:if="${#sets.contains(operatingUser.authorizationType.accessSet, 'CAN_MANAGE_USERS')}">
    <h3>User Types</h3>
    <table id="user-types-table" class="display" style="width:100%">
        <thead>
        <tr>
            <th>Name</th>
            <th>Access Set</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Data will be dynamically loaded here -->
        </tbody>
    </table>

    </div>
    <h3>Users</h3>
    <table id="user-table" class="display" style="width:100%">
        <thead>
        <tr>
            <th>Name</th>
            <th>Username</th>
            <th>Email Address</th>
            <th>User Type</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Data will be dynamically loaded here -->
        </tbody>
    </table>
    <h3>NPEs</h3>
    <table id="npe-table" class="display" style="width:100%">
        <thead>
        <tr>
            <th>Name</th>
            <th>Username</th>
            <th>Last Seen</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Data will be dynamically loaded here -->
        </tbody>
    </table>


</div>
</div>
</div>
</div>
<!-- Policy Viewer Modal -->
<div class="modal fade" id="policyModal" tabindex="-1" aria-labelledby="policyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="policyModalLabel">Agent Policy</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <pre id="policyContent" style="display: none;">Loading...</pre>
                <textarea id="policyEditor" style="display: none; width: 100%; height: 400px; background: #222; color: #00ff00; border: none; border-radius: 5px; padding: 10px;"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" id="savePolicyBtn" style="display: none;">Save Policy</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/add_user.js}" defer></script>
<script type="module" th:src="@{/js/add_type.js}" defer></script>
</body>

</html>
