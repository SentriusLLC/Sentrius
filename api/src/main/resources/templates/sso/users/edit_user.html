<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark" data-bs-theme="dark">
<head>
    <meta th:replace="~{fragments/header}">
    <title>Edit User</title>
</head>

<body>
<div class="container-fluid">
    <div class="row flex-nowrap">
        <div th:replace="~{fragments/sidebar}" class="col-auto sidebar" style="width: 180px;"></div>
        <div class="col py-4">
            <div class="main-content">
                <h3>Edit User</h3>
                <div id="alertContainer" class="mt-3"></div>

                <form id="editUserForm" th:action="@{/api/v1/users/update}" method="post">
                    <!-- CSRF hidden input -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" id="csrfToken"/>

                    <!-- Hidden ID and userId -->
                    <input type="hidden" name="id" th:value="${user.id}"/>
                    <input type="hidden" name="userId" th:value="${user.userId}"/>

                    <table class="table table-striped table-dark">
                        <thead>
                        <tr>
                            <th>Setting</th>
                            <th>Value</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td><label for="name">Name</label></td>
                            <td><input type="text" id="name" name="name" class="form-control" th:value="${user.name}"></td>
                        </tr>
                        <tr>
                            <td><label for="username">Username</label></td>
                            <td><input type="text" id="username" name="username" class="form-control" th:value="${user.username}" readonly></td>
                        </tr>
                        <tr>
                            <td><label for="email">Email Address</label></td>
                            <td><input type="email" id="email" name="emailAddress" class="form-control" th:value="${user.emailAddress}" readonly></td>
                        </tr>
                        <tr>
                            <td><label for="authorizationType">User Type</label></td>
                            <td>
                                <select id="authorizationType" name="authorizationType.userTypeName" class="form-control">
                                    <option th:each="type : ${userTypes}" th:value="${type.userTypeName}"
                                            th:text="${type.userTypeName}"
                                            th:selected="${type.id == user.authorizationType.userTypeName}"></option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="status">Status</label></td>
                            <td>
                                <select id="status" name="status" class="form-control">
                                    <option value="ACTIVE" th:selected="${user.status == 'ACTIVE'}">Active</option>
                                    <option value="LOCKED" th:selected="${user.status == 'LOCKED'}">Locked</option>
                                </select>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <button type="submit" class="btn btn-success">Save Changes</button>
                    <a href="/sso/v1/users/list" class="btn btn-secondary">Cancel</a>
                    <a th:href="@{/sso/v1/attributes/manage?tab=assignments&userId={userId}(userId=${user.userId})}" 
                       class="btn btn-primary" style="margin-left: 10px;">
                        <i class="fas fa-tags"></i> Manage Attributes
                    </a>
                </form>

                <!-- Visibility Expression Section -->
                <hr class="my-4"/>
                <h4>Access Policy Expression (ABAC)</h4>
                <p class="text-muted">
                    Define attribute-based access control expressions for this user. 
                    <a href="/sso/v1/attributes/manage" target="_blank">Learn more about ABAC <i class="fas fa-external-link-alt"></i></a>
                </p>
                <div id="attributeAlert"></div>
                <div class="input-group mb-3">
                    <input type="text" id="visibilityExpression" class="form-control"
                           placeholder="e.g., DEV&LEAD|DATA_ATTRIBUTE"
                           th:value="${visibilityExpression}">
                    <button class="btn btn-success" id="saveExpressionBtn">Save</button>
                </div>
                <small class="form-text text-muted">
                    Use <code>&</code> for AND, <code>|</code> for OR, <code>()</code> for grouping.
                    Example: <code>(DEV&LEAD)|DATA_ATTRIBUTE</code>
                </small>

            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("editUserForm");
        const alertContainer = document.getElementById("alertContainer");

        // Normal user form submit
        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const formData = new FormData(form);
            const payload = {};
            let csrfToken = null;

            formData.forEach((value, key) => {
                if (key.toLowerCase().includes("csrf")) {
                    csrfToken = value;
                } else {
                    if (key.includes(".")) {
                        const [parent, child] = key.split(".");
                        if (!payload[parent]) payload[parent] = {};
                        payload[parent][child] = value;
                    } else {
                        payload[key] = value;
                    }
                }
            });

            fetch(form.action, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Requested-With": "XMLHttpRequest",
                    "X-CSRF-TOKEN": csrfToken
                },
                body: JSON.stringify(payload)
            })
                .then(res => {
                    if (!res.ok) throw new Error("Failed to update user");
                    return res.json();
                })
                .then(data => {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success">${data.status || "User updated successfully."}</div>
                    `;
                })
                .catch(err => {
                    console.error(err);
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger">Error updating user.</div>
                    `;
                });
        });

        // Save visibility expression
        const userId = document.querySelector("input[name='userId']").value;
        const saveBtn = document.getElementById("saveExpressionBtn");
        const input = document.getElementById("visibilityExpression");
        const attributeAlert = document.getElementById("attributeAlert");

        saveBtn.addEventListener("click", function () {
            const csrfToken = document.getElementById("csrfToken").value;

            const payload = {
                attributeName: "VISIBILITY_EXPRESSION",
                attributeValue: input.value,
                attributeType: "STRING",
                source: "SENTRIUS",
                isActive: true
            };

            fetch(`/api/v1/users/attributes/update?userId=${userId}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Requested-With": "XMLHttpRequest",
                    "X-CSRF-TOKEN": csrfToken
                },
                body: JSON.stringify(payload)
            })
                .then(res => {
                    if (!res.ok) throw new Error("Failed to save expression");
                    return res.json();
                })
                .then(() => {
                    attributeAlert.innerHTML =
                        `<div class="alert alert-success">Expression saved successfully</div>`;
                })
                .catch(err => {
                    console.error(err);
                    attributeAlert.innerHTML =
                        `<div class="alert alert-danger">Error saving expression</div>`;
                });
        });
    });
</script>
</body>
</html>
