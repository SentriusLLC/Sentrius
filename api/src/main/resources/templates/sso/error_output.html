<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta th:replace="fragments/header">

    <script th:inline="javascript">

        $(document).ready(function () {
        });
        /*]]>*/
    </script>
    <title>[[${systemOptions.systemLogoName}]] - Error Logs</title>
    <style>
        .healing-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }
        .healing-QUEUED { background: #ffc107; color: #000; }
        .healing-IN_PROGRESS { background: #17a2b8; color: #fff; }
        .healing-COMPLETED { background: #28a745; color: #fff; }
        .healing-FAILED { background: #dc3545; color: #fff; }
        .trigger-healing-btn {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/topbar"></div>
<div class="container">
            <h2>Error Logs</h2>
            <p>Click on the collapsible panel to open and close it. Most recent 10 logs are shown</p>
        <div class="accordion" id="accordion">
            <template th:each="output : ${output}" th:remove="tag"
                      th:if="${output != null && !output.empty}">

                <!--
                <div class="accordion-item">
    <h2 class="accordion-header" id="headingOne">
      <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
        Accordion Item #1
      </button>
    </h2>
    <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
      <div class="accordion-body">
        <strong>This is the first item's accordion body.</strong> It is shown by default, until the collapse plugin adds the appropriate classes that we use to style each element. These classes control the overall appearance, as well as the showing and hiding via CSS transitions. You can modify any of this with custom CSS or overriding our default variables. It's also worth noting that just about any HTML can go within the <code>.accordion-body</code>, though the transition does limit overflow.
      </div>
    </div>
  </div>
                -->
                <div class="accordion-item">
                    <h2 class="accordion-header" th:id="'heading_' + ${output.id}">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" th:data-bs-target="'#collapse_'+ ${output.id}" aria-expanded="true" th:aria-controls="'#collapse_'+ ${output.id}">
                                <span th:text="'Error Log produced at ' + ${output.logTm}"></span>
                                <span th:if="${output.healingStatus}" th:class="'healing-status healing-' + ${output.healingStatus}" th:text="${output.healingStatus}"></span>
                            </button>
                    </h2>

                    <div th:id="'collapse_' + ${output.id}" class="accordion-collapse" th:aria-labelledby="'heading_' + ${output.id}" data-parent="#accordion">
                        <div th:id="'collapse_output_' + ${output.id}" class="accordion-body output_body" style="white-space: pre-wrap" th:utext="${output.errorLogs}">Panel Body</div>
                        <div class="accordion-body">
                            <button type="button" class="btn btn-sm btn-primary trigger-healing-btn" 
                                    th:attr="data-error-id=${output.id}"
                                    onclick="triggerHealing(this.getAttribute('data-error-id'))"
                                    th:if="${output.healingStatus == null || output.healingStatus == 'NONE'}">
                                <i class="bi bi-wrench"></i> Trigger Self-Healing
                            </button>
                            <a th:if="${output.healingSessionId}" 
                               th:href="@{/sso/v1/self-healing/sessions(sessionId=${output.healingSessionId})}"
                               class="btn btn-sm btn-outline-info trigger-healing-btn">
                                <i class="bi bi-eye"></i> View Healing Session
                            </a>
                        </div>
                    </div>
                </div>
            </template>
            <form id="clearLogs" action="/api/v1/notification/error/log/clear" method="POST">
                <input type="hidden" name="_csrf" th:value="${session._csrf}"/>
                <template th:each="output : ${sortedSet.itemList}" th:remove="tag" th:if="${sortedSet.itemList != null && !sortedSet.itemList.empty}">
                    <input type="hidden" th:name="'log_' + ${output.id}" th:value="${output.id}"/>
                </template>
                <button type="button" class="btn btn-secondary submit_btn" name="clear" value="clear">Clear These Logs</button><button type="button" class="btn btn-secondary submit_btn" name="clear" value="clearall">Clear All Logs</button>
            </form>
    </div>
</div>

<script>
    function triggerHealing(errorId) {
        if (!confirm('Trigger self-healing for this error?')) return;

        fetch(`/api/v1/self-healing/trigger/${errorId}`, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + getAuthToken()
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Self-healing initiated! Session ID: ' + data.sessionId);
                location.reload();
            } else {
                alert('Failed to trigger self-healing: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error triggering self-healing:', error);
            alert('Error triggering self-healing');
        });
    }

    function getAuthToken() {
        // This should retrieve the actual auth token from your session/storage
        return sessionStorage.getItem('authToken') || '';
    }
</script>
</body>

</html>
