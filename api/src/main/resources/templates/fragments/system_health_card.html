<div id="system-health-card" class="card custom-dark-card shadow-sm" style="display: none;">
    <div class="card-header position-relative">
        <a href="/sso/v1/system/settings" class="card-link">
            <i class="fas fa-heartbeat me-2"></i>System Health
        </a>
        <i class="fas fa-server card-icon"></i>
    </div>
    <div class="card-body">
        <div class="mb-3 text-center">
            <span id="system-overall-status" class="badge bg-success fs-6 px-3 py-2">
                <i class="fas fa-check-circle me-1"></i> All Systems Operational
            </span>
        </div>
        <div id="system-components-list" class="component-list">
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary">
                <span><i class="fas fa-server me-2 text-info"></i>API Server</span>
                <span class="badge bg-success">Healthy</span>
            </div>
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary">
                <span><i class="fas fa-database me-2 text-info"></i>Database</span>
                <span class="badge bg-success">Healthy</span>
            </div>
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary">
                <span><i class="fas fa-key me-2 text-info"></i>Authentication</span>
                <span class="badge bg-success">Healthy</span>
            </div>
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary">
                <span><i class="fas fa-terminal me-2 text-info"></i>SSH Proxy</span>
                <span class="badge bg-success">Healthy</span>
            </div>
            <div class="d-flex justify-content-between align-items-center py-2">
                <span><i class="fas fa-desktop me-2 text-info"></i>RDP Proxy</span>
                <span class="badge bg-success">Healthy</span>
            </div>
        </div>
        <div class="mt-3 text-center text-muted" style="font-size: 0.75rem;">
            <i class="fas fa-clock me-1"></i> Last checked: <span id="health-last-check">--</span>
        </div>
    </div>
</div>
