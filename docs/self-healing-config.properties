# Sentrius Self-Healing Configuration Example
#
# This file demonstrates how to configure the self-healing system
# Add these properties to your application.properties or application.yml

# ===================================================================
# SELF-HEALING CONFIGURATION
# ===================================================================

# Enable or disable the self-healing system globally
self-healing.enabled=true

# Off-hours scheduling (24-hour format)
# Errors configured with OFF_HOURS policy will be healed during this window
self-healing.off-hours.start=22
self-healing.off-hours.end=6

# ===================================================================
# CODING AGENT CONFIGURATION
# ===================================================================

# Agent launcher service URL
self-healing.agent-launcher.url=http://localhost:8080

# OAuth2 client credentials for coding agents
self-healing.coding-agent.client-id=coding-agents
self-healing.coding-agent.client-secret=

# ===================================================================
# DOCKER IMAGE BUILDER CONFIGURATION
# ===================================================================

# Enable automatic Docker image building after fixes
self-healing.auto-build-image=true

# Kubernetes namespace for build jobs
self-healing.builder.namespace=dev

# Kaniko builder image
self-healing.builder.image=gcr.io/kaniko-project/executor:latest

# Docker registry for pushing images (leave empty for local registry)
self-healing.docker.registry=

# Build timeout in seconds (default: 30 minutes)
self-healing.builder.timeout-seconds=1800

# ===================================================================
# GITHUB INTEGRATION (Optional)
# ===================================================================
# When configured, the self-healing system can create pull requests with fixes

# Enable GitHub PR creation
self-healing.github.enabled=false

# GitHub API endpoint (use enterprise URL for GitHub Enterprise)
self-healing.github.api-url=https://api.github.com

# GitHub personal access token with repo permissions
# Generate at: https://github.com/settings/tokens
self-healing.github.token=

# Default repository owner (organization or username)
self-healing.github.owner=

# Default repository name
self-healing.github.repo=

# ===================================================================
# EXAMPLE POD CONFIGURATIONS
# ===================================================================
# These can be configured via the UI at /sso/v1/self-healing/config
# or via the REST API at /api/v1/self-healing/config

# Example 1: Immediate healing for non-critical services
# {
#   "podName": "sentrius-api",
#   "podType": "api",
#   "patchingPolicy": "IMMEDIATE",
#   "enabled": true
# }

# Example 2: Off-hours healing for production services
# {
#   "podName": "sentrius-core",
#   "podType": "core",
#   "patchingPolicy": "OFF_HOURS",
#   "enabled": true
# }

# Example 3: Disabled healing for critical infrastructure
# {
#   "podName": "postgres",
#   "podType": "database",
#   "patchingPolicy": "NEVER",
#   "enabled": false
# }

# ===================================================================
# SCHEDULED TASK CONFIGURATION
# ===================================================================
# The self-healing orchestrator runs on these schedules:

# Error scanning frequency: Every 5 minutes
# spring.task.scheduling.pool.size=5

# Queued error processing: Every hour (during off-hours only)
# Uses cron expression: 0 0 * * * *

# ===================================================================
# SECURITY KEYWORDS
# ===================================================================
# The following keywords in error logs will flag errors as security concerns:
# - authentication, authorization, access denied, forbidden
# - security, vulnerability, exploit, injection, xss, csrf
# - unauthorized, privilege, crypto, ssl, tls
#
# Security-flagged errors require manual review before healing proceeds

# ===================================================================
# KUBERNETES CONFIGURATION
# ===================================================================
# Ensure the agent-launcher service is properly configured:

# Agent registry for pulling images
sentrius.agent.registry=local

# Namespace for launching healing agents
sentrius.agent.namespace=dev

# Agent image version
sentrius.agent.registry.version=latest

# Agent callback URL format
sentrius.agent.callback.format.url=http://sentrius-agent-%s.%s.svc.cluster.local:8090
