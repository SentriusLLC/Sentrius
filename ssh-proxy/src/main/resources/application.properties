# Sentrius SSH Proxy Configuration
server.port=8090
spring.application.name=sentrius-ssh-proxy

# SSH Proxy Configuration
sentrius.ssh-proxy.enabled=true
sentrius.ssh-proxy.port=2222
sentrius.ssh-proxy.host-key-path=/tmp/ssh-proxy-hostkey.ser
sentrius.ssh-proxy.max-concurrent-sessions=100

# Target SSH Configuration
sentrius.ssh-proxy.target-ssh.default-host=localhost
sentrius.ssh-proxy.target-ssh.default-port=22
sentrius.ssh-proxy.target-ssh.connection-timeout=30000
sentrius.ssh-proxy.target-ssh.keep-alive-interval=60000

# Keycloak Configuration for Agent Launcher Authentication
keycloak.realm=sentrius
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}
spring.security.oauth2.client.registration.keycloak.client-id=ssh-proxy
spring.security.oauth2.client.registration.keycloak.client-secret=${SSH_PROXY_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak.scope=openid

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_BASE_URL:http://localhost:8081}/realms/sentrius
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_BASE_URL:http://localhost:8081}/realms/sentrius

# Agent Integration
agent.launcher.url=${AGENT_LAUNCHER_URL:http://localhost:8082}
agent.chat.enabled=${AGENT_CHAT_ENABLED:true}

# SSH Agent Kafka Configuration
ssh.agent.kafka.enabled=${SSH_AGENT_KAFKA_ENABLED:true}
ssh.agent.kafka.query.topic=ssh-agent-queries
ssh.agent.kafka.response.topic=ssh-agent-responses
ssh.agent.response.timeout.seconds=30

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=io.sentrius.sso.core.dto.agents
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=true

# Logging
logging.level.io.sentrius.sso.sshproxy=DEBUG
logging.level.org.apache.sshd=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Disable unnecessary Spring Boot features for SSH proxy
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration