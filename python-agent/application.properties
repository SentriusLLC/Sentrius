# Sentrius Python Agent Configuration

# Test Mode - set to true to disable external service connections
test.mode=${TEST_MODE:false}

# Keycloak Configuration
keycloak.realm=sentrius
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8180}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:python-agents}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:your-client-secret}

# Agent Configuration
agent.name.prefix=python-agent
agent.type=python
agent.callback.url=${AGENT_CALLBACK_URL:http://localhost:8093}
agent.api.url=${AGENT_API_URL:http://localhost:8080/}
agent.heartbeat.interval=30

# LLM Configuration  
agent.llm.endpoint=${LLM_ENDPOINT:http://localhost:8084/}
agent.llm.enabled=true

# Agent Definitions - these reference YAML files that define agent behavior
agent.chat.helper.config=python-agent/chat-helper.yaml
agent.chat.helper.enabled=true

agent.data.analyst.config=python-agent/data-analyst.yaml
agent.data.analyst.enabled=false

agent.terminal.helper.config=python-agent/terminal-helper.yaml
agent.terminal.helper.enabled=false

agent.mcp.config=python-agent/mcp.yaml
agent.mcp.enabled=true

agent.coding.config=python-agent/coding.yaml
agent.coding.enabled=true

# OpenTelemetry Configuration
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.traces.exporter=otlp
otel.exporter.otlp.protocol=grpc
otel.metrics.exporter=none
otel.logs.exporter=none
otel.resource.attributes.service.name=python-agent
otel.traces.sampler=always_on
otel.exporter.otlp.timeout=10s

# Provenance Configuration
provenance.kafka.topic=sentrius-provenance

# Logging Configuration
logging.level=INFO