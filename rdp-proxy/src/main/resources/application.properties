# RDP Proxy Configuration
server.port=8082

# Asymmetric JWT Authentication Configuration
sentrius.rdp-proxy.security.jwt.algorithm=RS256
sentrius.rdp-proxy.security.jwt.keySize=2048
sentrius.rdp-proxy.security.jwt.keyRotationDays=30
sentrius.rdp-proxy.security.jwt.issuer=sentrius-api
sentrius.rdp-proxy.security.jwt.audience=rdp-proxy
sentrius.rdp-proxy.security.jwt.tokenTtlMinutes=30

# RSA Key Management Configuration
sentrius.rdp-proxy.security.rsa.keyStorePath=${user.home}/.sentrius/keys/
sentrius.rdp-proxy.security.rsa.publicKeyEndpoint=/api/v1/rdp-proxy/public-key
sentrius.rdp-proxy.security.rsa.keyRotationEnabled=true
sentrius.rdp-proxy.security.rsa.multipleKeySupport=true

# WebSocket Security Configuration
sentrius.rdp-proxy.security.websocket.allowedOrigins=https://localhost:3000,https://sentrius.example.com
sentrius.rdp-proxy.security.websocket.maxSessions=100
sentrius.rdp-proxy.security.websocket.connectionTimeout=30000
sentrius.rdp-proxy.security.websocket.requireAuthentication=true

# Guacamole Configuration
sentrius.rdp-proxy.guacamole.enableAudio=true
sentrius.rdp-proxy.guacamole.enableFileTransfer=true
sentrius.rdp-proxy.guacamole.enableClipboard=true
sentrius.rdp-proxy.guacamole.enablePrinting=false
sentrius.rdp-proxy.guacamole.connectionTimeout=30000
# Guacamole daemon connection (local instance)
sentrius.rdp-proxy.guacamole.guacd.hostname=${GUACD_HOST:localhost}
sentrius.rdp-proxy.guacamole.guacd.port=${GUACD_PORT:4822}

# Backward compatibility - deprecated HMAC secret (not needed for asymmetric JWT)
sentrius.rdp-proxy.hmac-secret=defaultSecretForBackwardCompatibility

# ZtatTokenService Configuration
# Base URL for ZtatTokenService to fetch public key for JWT validation
# If not set, RDP proxy will only validate JWTs from Keycloak
sentrius.ztat.base-url=${ZTAT_BASE_URL:http://localhost:8080}

# Target Resolution Configuration  
sentrius.rdp-proxy.targets.rdp-dev.host=10.0.2.20
sentrius.rdp-proxy.targets.rdp-dev.port=3389
sentrius.rdp-proxy.targets.rdp-prod.host=10.0.3.30
sentrius.rdp-proxy.targets.rdp-prod.port=3389

# Logging Configuration
logging.level.io.sentrius.sso.rdpproxy=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Database Configuration (if needed)
spring.datasource.url=jdbc:postgresql://home.guard.local:5432/sentrius
spring.datasource.username=postgres  
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keycloak Configuration
keycloak.realm=sentrius
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}