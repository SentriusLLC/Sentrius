                  number: 8080

    - host: "agentproxy.december.trustpolicy.ai"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentrius-agentproxy
                port:
                  number: 8080

    - host: "rdpproxy.december.trustpolicy.ai"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentrius-rdp-proxy
