apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentrius-sentrius
  labels:
    app.kubernetes.io/name: sentrius
    app.kubernetes.io/instance: sentrius
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentrius
  template:
    metadata:
      labels:
        app: sentrius
    spec:
      # Only needed when using in-cluster Postgres (Minikube, local dev)
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: [ "sh", "-c", "until nc -z sentrius-postgres 5432; do echo waiting for postgres; sleep 2; done;" ]

      containers:
        - name: sentrius
          image: "us-central1-docker.pkg.dev/sentrius-project/sentrius-repo:tag"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: config-volume
              mountPath: /config

          env:
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sentrius-oauth2-secrets
                  key: sentrius-api-client-secret

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sentrius-db-secret
                  key: db-username

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentrius-db-secret
                  key: db-password

            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentrius-db-secret
                  key: keystore-password

            # Database URL switches based on Cloud SQL mode
            - name: SPRING_DATASOURCE_URL
              value:
                    "jdbc:postgresql://sentrius-postgres:5432/sentrius"

      volumes:
        - name: config-volume
          configMap:
            name: sentrius-config
