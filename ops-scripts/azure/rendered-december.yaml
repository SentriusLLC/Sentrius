apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init-1767121633
  namespace: december
  labels:
    app: kafka-topic-init
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:4.1.0
          command:
            - /bin/bash
            - -c
            - |
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server sentrius-kafka:9092 \
                --create \
                --if-not-exists \
                --topic sentrius-provenance \
                --partitions 1 \
                --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server sentrius-kafka:9092 \
                --create --if-not-exists \
                --topic ssh-agent-queries \
                --partitions 1 \
                --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server sentrius-kafka:9092 \
                --create --if-not-exists \
                --topic ssh-agent-responses \
                --partitions 1 \
                --replication-factor 1
