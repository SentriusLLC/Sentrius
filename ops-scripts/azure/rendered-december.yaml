# Source: sentrius-chart/templates/ingress.yaml
# Apps Ingress - Deploy this second in Azure, after Keycloak is healthy
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress-december
  namespace: december
  annotations:
    kubernetes.io/ingress.class: "nginx"
    kubernetes.io/ingress.allow-http: "true"

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "december.trustpolicy.ai"
        - "agentproxy.december.trustpolicy.ai"
        - "rdpproxy.december.trustpolicy.ai"
      secretName: wildcard-cert-december

  rules:
    - host: "december.trustpolicy.ai"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
