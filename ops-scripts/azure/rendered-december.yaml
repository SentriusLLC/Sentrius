kind: Ingress
metadata:
  name: keycloak-ingress-december
  namespace: december
  annotations:
    kubernetes.io/ingress.class: "nginx"
    kubernetes.io/ingress.allow-http: "true"

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "keycloak.december.trustpolicy.ai"
      secretName: wildcard-cert-december

  rules:
    - host: "keycloak.december.trustpolicy.ai"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentrius-keycloak
                port:
                  number: 8081
