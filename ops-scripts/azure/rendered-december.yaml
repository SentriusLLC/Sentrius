  assessor-config.yaml: |
    description: "Agent that handles logs and OpenAI access."
    context: |
      Your job is to fetch logs for currently open terminals and assess if the user is performing risky behavior.
      Risk should be defined in a json response of the form:
      {
        "assessments": [
            {
            "sessionId": "<id>",
            "risk": "<low|medium|high>",
            "description": "<why they received the risk>"
            }
        ]
      }
  agentproxy-application.properties: |
    keystore.file=sso.jceks
    keystore.password=${KEYSTORE_PASSWORD}
    keystore.alias=KEYBOX-ENCRYPTION_KEY
    spring.thymeleaf.enabled=true
    spring.freemarker.enabled=false
    management.metrics.enable.system.processor=true
    spring.autoconfigure.exclude=
    #flyway configuration
    spring.main.web-application-type=reactive
    spring.flyway.enabled=false
    spring.datasource.url=${SPRING_DATASOURCE_URL}
    spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
    spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
    spring.datasource.driver-class-name=org.postgresql.Driver
    # Connection pool settings
    spring.datasource.hikari.maximum-pool-size=10
    spring.datasource.hikari.minimum-idle=5
    spring.datasource.hikari.idle-timeout=30000
    spring.datasource.hikari.max-lifetime=1800000
    # Hibernate settings (optional, for JPA)
    spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
    # Disable automatic schema generation in production
    spring.jpa.hibernate.ddl-auto=none
    # Ensure this path matches your project structure
    #spring.flyway.locations=classpath:db/migration/
    spring.flyway.baseline-on-migrate=true
    logging.level.org.springframework.web=INFO
    logging.level.org.springframework.security=INFO
    logging.level.io.sentrius=DEBUG
    logging.level.org.thymeleaf=INFO
    spring.thymeleaf.servlet.produce-partial-output-while-processing=false
    spring.servlet.multipart.enabled=true
    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=10MB
    server.error.whitelabel.enabled=false
    dynamic.properties.path=/config/dynamic.properties
    keycloak.realm=sentrius
    keycloak.base-url=https://keycloak.december.trustpolicy.ai
    agent.api.url=https://december.trustpolicy.ai
    # Keycloak configuration
    spring.security.oauth2.client.registration.keycloak.client-id=sentrius-agent-proxy
    spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
    spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
    #spring.security.oauth2.client.registration.keycloak.redirect-uri=https://december.trustpolicy.ai/login/oauth2/code/keycloak
    #spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
    spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloak.december.trustpolicy.ai/realms/sentrius
    spring.security.oauth2.client.provider.keycloak.issuer-uri=https://keycloak.december.trustpolicy.ai/realms/sentrius
    # OTEL settings
    otel.traces.exporter=otlp
    otel.metrics.exporter=none
    otel.logs.exporter=none
    otel.exporter.otlp.endpoint=http://sentrius-jaeger:4317
    otel.resource.attributes.service.name=integration-proxy
    otel.traces.sampler=always_on
    otel.exporter.otlp.timeout=10s
    otel.exporter.otlp.protocol=grpc
    provenance.kafka.topic=sentrius-provenance
    # Serialization
    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
    spring.kafka.producer.properties.spring.json.trusted.packages=io.sentrius.*
    # Reliability
    spring.kafka.producer.retries=5
    spring.kafka.producer.acks=all
    # Timeout tuning
    spring.kafka.producer.request-timeout-ms=10000
    spring.kafka.producer.delivery-timeout-ms=30000
    spring.kafka.properties.max.block.ms=500
    spring.kafka.properties.metadata.max.age.ms=10000
    spring.kafka.properties.retry.backoff.ms=1000
    spring.kafka.bootstrap-servers=sentrius-kafka:9092
