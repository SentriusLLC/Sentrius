keystore.file=sso.jceks
keystore.password=keystorepassword

keystore.alias=KEYBOX-ENCRYPTION_KEY
keystore.algorithm=AES

spring.main.web-application-type=servlet
spring.thymeleaf.enabled=true
spring.freemarker.enabled=false

#flyway configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

## h2 database

spring.datasource.url=jdbc:postgresql://home.guard.local:5432/sentrius
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate settings (optional, for JPA)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


## Logging

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.io.sentrius=DEBUG

logging.level.org.thymeleaf=INFO

spring.thymeleaf.servlet.produce-partial-output-while-processing=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB 
spring.servlet.multipart.max-request-size=10MB


server.error.whitelabel.enabled=false



keycloak.realm=sentrius
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8180}
## These are programmatically set.
spring.security.oauth2.client.registration.keycloak.client-id=java-agents
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak.redirect-uri=http://192.168.1.162:8080/login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration



spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/sentrius
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/sentrius
# for testing analytics agents
agents.ai.chat.agent.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
server.port=8093
agent.callback.url=http://localhost:8093
agent.api.url=http://localhost:8080/
agent.open.ai.endpoint=http://localhost:8084/
agent.ai.config=chat-helper.yaml

# Coding Agent Configuration
agent.coding.enabled=${CODING_AGENT_ENABLED:false}
agent.coding.callback.url=${CODING_AGENT_URL:http://localhost:8094}
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://home.guard.local:4317}
otel.traces.exporter=otlp
otel.exporter.otlp.protocol=grpc
otel.metrics.exporter=none
otel.logs.exporter=none
otel.resource.attributes.service.name=chat-helper
otel.traces.sampler=always_on
otel.exporter.otlp.timeout=10s
agent.type="chat-helper"
agent.listen.websocket=true

provenance.kafka.topic=sentrius-provenance