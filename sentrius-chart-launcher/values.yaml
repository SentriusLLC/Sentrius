    nodePort: 30087
  image:
    repository: sentrius-launcher-service
    pullPolicy: IfNotPresent
  port: 8080
  oauth2:
    client_id: sentrius-launcher-service
    client_secret: ""  # To be set via environment variable or external secret
    authorization_grant_type: authorization_code
    redirect-uri: http://{{ .Values.subdomain }}/login/oauth2/code/keycloak
    scope: openid,profile,email
    issuer-uri: http://keycloak.{{ .Values.subdomain }}/realms/sentrius
  resources: {}
  config:
    application: |
  annotations:
    gke:
      cloud.google.com/backend-config: '{"default": "sentrius-backend-config"}'
