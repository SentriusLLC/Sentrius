    azure:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# PostgreSQL configuration
postgres:
  image:
    repository: postgres
    tag: 15
  port: 5432
  storageSize: 10Gi
  env:
    POSTGRES_DB: sentrius

ssh:
  image:
    repository: sentrius-ssh
    pullPolicy: IfNotPresent
  port: 22

# Secrets
secrets:
  db:
    username: YWRtaW4=       # admin
    password: cGFzc3dvcmQ=   # password
    keystorePassword: c2VudHJpdXM= # sentrius

keycloak:
  image:
    repository: sentrius-keycloak
    pullPolicy: IfNotPresent
  host: keycloak.default.svc.cluster.local
  adminUser: admin
  adminPassword: ""  # To be set via environment variable or external secret
  serviceType: ClusterIP
  port: 8081
  clientId: sentrius-api
  clientSecret: ""  # To be set via environment variable or external secret
  db:
    image: postgres:15
    user: keycloak
    password: password
    database: keycloak
    storageSize: 10Gi
  replicas: 1
  annotations:
    gke:
      cloud.google.com/backend-config: '{"default": "sentrius-backend-config"}'
    aws:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    azure:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"

ingress:
  enabled: true
  class: "nginx"  # Default for local; override for GKE/AWS
  tlsEnabled: true  # Enable TLS when supported
  annotations:
    gke:  # GKE-specific annotations
      kubernetes.io/ingress.class: gce
      networking.gke.io/managed-certificates: wildcard-cert
      kubernetes.io/ingress.allow-http: "false"
      ingress.kubernetes.io/force-ssl-redirect: "true"
    aws:  # AWS-specific annotations for ALB
      kubernetes.io/ingress.class: alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/ssl-redirect: "443"
    local:  # Local environment annotations (e.g., Minikube)
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/enable-websocket: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"



healthCheck:
  enabled: true
  backendConfig:
    enabled: false  # Only enable for GKE
  readinessProbe:
    path: "/actuator/health"
    port: 8080
  livenessProbe:
    path: "/actuator/health"
    port: 8080
  keycloak:
    readinessPath: "/health/ready"
    livenessPath: "/health/live"
    port: 8081

version: '3.7'

jaeger:
  enabled: true
  provisionDataStore:
    cassandra: false

  storage:
    type: memory   # (easy for dev/test)

  collector:
    enabled: true
    service:
      otlp:
        grpc:
          enabled: true
          port: 4317
        http:
          enabled: true
          port: 4318

  agent:
    enabled: true

  query:
    enabled: true
    service:
      type: ClusterIP
      ports:
        - name: http-query
          port: 16686
          targetPort: 16686

  ingress:
    enabled: true
    host: jaeger.{{ .Values.subdomain }}
    annotations:
      kubernetes.io/ingress.class: nginx

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi


kafka:
  enabled: true
  serverName: sentrius-kafka:9092
  image:
    repository: apache/kafka
    tag: 4.1.0
    pullPolicy: IfNotPresent
  port: 9092
  # Remove or comment out the zookeeper section
  # zookeeper:
  #   enabled: false
  resources: {}
  kraft:
    enabled: true
    clusterId: "my-cluster-id"  # Use a unique base64-encoded string
    controllerQuorumVoters: "0@localhost:9093"

neo4j:
  enabled: true
  image:
    repository: neo4j
    tag: 5.15
    pullPolicy: IfNotPresent
  port: 7687
  httpPort: 7474
  resources: {}
  env:
    NEO4J_AUTH: ""  # To be set via environment variable (e.g., neo4j/your-secure-password)
    NEO4J_server_config_strict__validation__enabled: "true"