# General settings
replicaCount: 1
namespace: default

environment: "gke"  # Can be "gke", "aws", "azure", "local"

tenant: sentrius-demo
sentriusNamespace: "sentrius-demo"
baseRelease: sentrius-demo
subdomain: "sentrius-demo.sentrius.cloud"
keycloakSubdomain: "keycloak.sentrius-demo.sentrius.cloud"
keycloakHostname: "keycloak.sentrius-demo.sentrius.cloud"
keycloakDomain: https://keycloak.sentrius-demo.sentrius.cloud
keycloakInternalDomain: http://sentrius-keycloak:8081 # Internal cluster communication
sentriusDomain: https://sentrius-demo.sentrius.cloud
keycloakFQDN: sentrius-keycloak.dev.svc.cluster.local
sentriusFQDN: sentrius-sentrius.dev.svc.cluster.local
integrationproxyFQDN: sentrius-integrationproxy.dev.svc.cluster.local
agentProxyFQDN: sentrius-agentproxy.dev.svc.cluster.local
otelFQDN: sentrius-jaeger.dev.svc.cluster.local



certificates:
  enabled: false  # Disable certs for local; enable for cloud
  issuer: "letsencrypt-prod"  # Change for cloud environments

metrics:
  enabled: true
  class:
    exclusion: ""
  serviceMonitor:
    enabled: true
    interval: "30s"
    scrapeTimeout: "10s"

# Sentrius configuration
sentrius:
  image:
    repository: us-central1-docker.pkg.dev/sentrius-project/sentrius-repo
    tag: tag
    pullPolicy: IfNotPresent
  port: 8080
  serviceType: ClusterIP
  ssh:
    port: 22
  resources: {}
  oauth2:
    client_id: sentrius-api
    client_secret: ""  # To be set via environment variable or external secret
    authorization_grant_type: authorization_code
    redirect_uri: http://{{ .Values.subdomain }}/login/oauth2/code/keycloak
    scope: openid,profile,email
    issuer_uri: http://keycloak.{{ .Values.subdomain }}/realms/sentrius
  annotations:
    gke:
      cloud.google.com/backend-config: '{"default": "sentrius-backend-config"}'
    aws:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    azure:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# Sentrius configuration
llmproxy:
  image:
    repository: us-central1-docker.pkg.dev/sentrius-project/llmproxy-repo
