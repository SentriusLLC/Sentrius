apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "sentrius.labels" . | nindent 4 }}
data:
  chat-helper.yaml: |
    description: "Agent that handles logs and OpenAI access."
    context: |
      You are a helpful agent that is responding to users via a chat interface. Please respond to the user in a friendly and helpful manner.
      Return responses in the following format:
      {
        "previousOperation": "<previousOperation>",
        "nextOperation": "<nextOperation>",
        "terminalSummaryForLLM": "<Summary of the terminal thus far for the next LLM assessment>",
          "responseForUser": "<Response to the user>"
      }
  chat-atpl-helper.yaml: |
    description: "Agent that handles logs and OpenAI access."
    context: |
      You are a helpful agent that helps define a a trust policy. Guide the user through the process of defining a trust policy for an agent.
      Here is the schema for the Agent Trust Policy Language (ATPL). If no version or policy_id given generate them.
      Most fields are optional, but the minimum will be capabilities. primitives are simple endpoint connections.
      Focus on getting those filled in. Following this list will be a message containing all endpoints of the system.
      {
      "$schema": "https://json-schema.org/draft/2020-12/schema",
      "$id": "https://sentrius.io/schemas/atpl.schema.json",
      "title": "Agent Trust Policy Language (ATPL)",
      "type": "object",
      "required": ["version", "policy_id", "capabilities"],
      "properties": {
        "version": {
          "type": "string",
          "pattern": "^v[0-9]+$"
        },
        "policy_id": {
          "type": "string"
        },
        "description": {
          "type": "string"
        },
        "match": {
          "type": "object",
          "properties": {
            "agent_tags": {
              "type": "array",
              "items": { "type": "string" }
            }
          }
        },
        "identity": {
          "type": "object",
          "properties": {
            "issuer": { "type": "string" },
            "subject_prefix": { "type": "string" },
            "mfa_required": { "type": "boolean" },
            "certificate_authority": { "type": "string" }
          }
        },
        "provenance": {
          "type": "object",
          "properties": {
            "source": { "type": "string" },
            "signature_required": { "type": "boolean" },
            "approved_committers": {
              "type": "array",
              "items": { "type": "string" }
            }
          }
        },
        "runtime": {
          "type": "object",
          "properties": {
            "enclave_required": { "type": "boolean" },
            "attestation_type": { "type": "string" },
            "verified_at_boot": { "type": "boolean" }
          }
        },
        "behavior": {
          "type": "object",
          "properties": {
            "minimum_positive_runs": { "type": "integer" },
            "max_incidents": { "type": "integer" },
            "incident_types": {
              "type": "object",
              "properties": {
                "denylist": {
                  "type": "array",
                  "items": { "type": "string" }
                }
              }
            }
          }
        },
        "trust_score": {
          "type": "object",
          "properties": {
            "minimum": { "type": "integer" },
            "weightings": {
              "type": "object",
              "properties": {
                "identity": { "type": "number" },
                "provenance": { "type": "number" },
                "runtime": { "type": "number" },
                "behavior": { "type": "number" }
              }
            }
          }
        },
        "capabilities": {
          "type": "object",
          "required": ["primitives", "composed"],
          "properties": {
            "primitives": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["id", "description"],
                "properties": {
                  "id": { "type": "string" },
                  "description": { "type": "string" },
                  "endpoints": {
                    "type": "array",
                    "items": { "type": "string" }
                  },
                  "commands": {
                    "type": "array",
                    "items": { "type": "string" }
                  },
                  "subcommands": {
                    "type": "array",
                    "items": { "type": "string" }
                  },
                  "activities": {
                    "type": "array",
                    "items": { "type": "string" }
                  },
                  "tags": {
                    "type": "array",
                    "items": { "type": "string" }
                  }
                }
              }
            },
            "composed": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["id", "includes"],
                "properties": {
                  "id": { "type": "string" },
                  "includes": {
                    "type": "array",
                    "items": { "type": "string" }
                  },
                  "tags": {
                    "type": "array",
                    "items": { "type": "string" }
                  },
                  "endpoints": {
                    "type": "array",
                    "items": { "type": "string" }
                  },
                  "commands": {
                    "type": "array",
                    "items": { "type": "string" }
                  },
                  "subcommands": {
                    "type": "array",
                    "items": { "type": "string" }
                  },
                  "activities": {
                    "type": "array",
                    "items": { "type": "string" }
                  }
                }
              }
            }
          }
        }
          ,
        "actions": {
          "type": "object",
          "properties": {
            "on_failure": {
              "type": "string",
              "enum": ["deny", "log", "alert"]
            },
            "on_success": {
              "type": "string",
              "enum": ["allow", "log"]
            },
            "on_marginal": {
              "oneOf": [
                {"type": "string", "enum": ["require_ztat", "log"]},
                {
                  "type": "object",
                  "properties": {
                    "action": {"type": "string", "enum": ["require_ztat"]},
                    "ztat_provider": {"type": "string"}
                  },
                  "required": ["action"]
                }
              ]
            }
          }
        },
        "ztat": {
          "type": "object",
          "properties": {
            "provider": {"type": "string"},
            "ttl": {"type": "string"},
            "approved_issuers": {
              "type": "array",
              "items": {"type": "string"}
            },
            "key_binding": {"type": "string"},
            "approval_required": {"type": "boolean"}
          }
        }
      }
      }
  launcher.properties: |
    spring.main.web-application-type=servlet
    spring.thymeleaf.enabled=false
    spring.freemarker.enabled=false
    #flyway configuration
    spring.flyway.enabled=false
    #spring.datasource.url=jdbc:h2:mem:testdb
    logging.level.org.springframework.web=DEBUG
    logging.level.org.springframework.security=DEBUG
    logging.level.io.sentrius=DEBUG
    logging.level.org.thymeleaf=INFO
    spring.thymeleaf.servlet.produce-partial-output-while-processing=false
    spring.servlet.multipart.enabled=true
    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=10MB
    server.error.whitelabel.enabled=false
    keycloak.realm=sentrius
    keycloak.base-url={{ .Values.keycloakInternalDomain | default .Values.keycloakDomain }}
    agent.api.url={{ .Values.sentriusDomain }}
    # Keycloak configuration
    spring.security.oauth2.client.registration.keycloak.client-id={{ .Values.launcherservice.oauth2.client_id }}
    spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
    spring.security.oauth2.client.registration.keycloak.authorization-grant-type={{ .Values.launcherservice.oauth2.authorization_grant_type }}
    spring.security.oauth2.client.registration.keycloak.redirect-uri={{ .Values.sentriusDomain }}/login/oauth2/code/keycloak
    spring.security.oauth2.client.registration.keycloak.scope={{ .Values.launcherservice.oauth2.scope }}
    spring.security.oauth2.resourceserver.jwt.issuer-uri={{ .Values.keycloakInternalDomain | default .Values.keycloakDomain }}/realms/sentrius
    spring.security.oauth2.client.provider.keycloak.issuer-uri={{ .Values.keycloakInternalDomain | default .Values.keycloakDomain }}/realms/sentrius
    # otel.traces.exporter=none
    otel.metrics.exporter=none
    otel.logs.exporter=none
    otel.instrumentation.spring.enabled=false
    otel.instrumentation.springboot.enabled=false

    management.endpoints.web.exposure.include=health
    management.endpoint.health.show-details=always
    agent.ai.config=assessor-config.yaml
    provenance.kafka.topic=none
    provenance.kafka.enabled=false
    # Serialization
    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
    spring.kafka.producer.properties.spring.json.trusted.packages=io.sentrius.*

    # Reliability
    spring.kafka.producer.retries=5
    spring.kafka.producer.acks=all

    spring.kafka.bootstrap-servers=sentrius-kafka:9092
    # Timeout tuning
    spring.kafka.producer.request-timeout-ms=10000
    spring.kafka.producer.delivery-timeout-ms=30000
    spring.kafka.properties.max.block.ms=500
    spring.kafka.properties.metadata.max.age.ms=10000
    spring.kafka.properties.retry.backoff.ms=1000

    sentrius.agent.registry=local
    sentrius.agent.registry.version=latest
    sentrius.agent.namespace={{ .Values.tenant }}
  agent.properties: |
    spring.main.web-application-type=servlet
    spring.thymeleaf.enabled=false
    spring.freemarker.enabled=false
    #flyway configuration
    spring.flyway.enabled=false
    #spring.datasource.url=jdbc:h2:mem:testdb
    logging.level.org.springframework.web=DEBUG
    logging.level.org.springframework.security=DEBUG
    logging.level.io.sentrius=DEBUG
    logging.level.org.thymeleaf=INFO
    spring.thymeleaf.servlet.produce-partial-output-while-processing=false
    spring.servlet.multipart.enabled=true
    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=10MB
    server.error.whitelabel.enabled=false
    keycloak.realm=sentrius
    keycloak.base-url={{ .Values.keycloakDomain }}

    # Keycloak configuration
    spring.security.oauth2.client.registration.keycloak.client-id={{ .Values.launcherservice.oauth2.client_id }}
    spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
    spring.security.oauth2.client.registration.keycloak.authorization-grant-type={{ .Values.launcherservice.oauth2.authorization_grant_type }}
    spring.security.oauth2.client.registration.keycloak.redirect-uri={{ .Values.sentriusDomain }}/login/oauth2/code/keycloak
    spring.security.oauth2.client.registration.keycloak.scope={{ .Values.launcherservice.oauth2.scope }}
    spring.security.oauth2.resourceserver.jwt.issuer-uri={{ .Values.keycloakDomain }}/realms/sentrius
    spring.security.oauth2.client.provider.keycloak.issuer-uri={{ .Values.keycloakDomain }}/realms/sentrius
    # otel.traces.exporter=none
    otel.metrics.exporter=none
    otel.logs.exporter=none
    otel.instrumentation.spring.enabled=false
    otel.instrumentation.springboot.enabled=false

    management.endpoints.web.exposure.include=health
    management.endpoint.health.show-details=always
    agent.ai.config=assessor-config.yaml
    provenance.kafka.topic=none
    provenance.kafka.enabled=false
    # Serialization
    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
    spring.kafka.producer.properties.spring.json.trusted.packages=io.sentrius.*

    # Reliability
    spring.kafka.producer.retries=5
    spring.kafka.producer.acks=all

    spring.kafka.bootstrap-servers=sentrius-kafka:9092
    # Timeout tuning
    spring.kafka.producer.request-timeout-ms=10000
    spring.kafka.producer.delivery-timeout-ms=30000
    spring.kafka.properties.max.block.ms=500
    spring.kafka.properties.metadata.max.age.ms=10000
    spring.kafka.properties.retry.backoff.ms=1000

    sentrius.agent.namespace={{ .Values.tenant }}
    agents.ai.chat.agent.enabled=true
    sentrius.agent.callback.format.url=http://sentrius-agent-%s.%s.svc.cluster.local:8090
    agent.api.url={{ .Values.sentriusDomain }}
    agent.open.ai.endpoint=http://sentrius-integrationproxy:8080/
    agent.listen.websocket=true
    server.port=8090