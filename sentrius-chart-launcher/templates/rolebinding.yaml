apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-launcher-binding
  namespace: {{ .Values.tenant }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-launcher
roleRef:
  kind: Role
  name: {{ .Release.Name }}-launcher-role
  apiGroup: rbac.authorization.k8s.io